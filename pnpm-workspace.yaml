packages:
  - '.'

autoInstallPeers: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
strictPeerDependencies: true
minimumReleaseAgeExclude:
  - '@tangle-network/*'

allowBuilds:
  '@ax-llm/ax': false
  '@tangle-network/browser-agent-driver': true
  better-sqlite3: true
  canvas: true
  cpu-features: false
  esbuild: true
  ffmpeg-static: false
  ssh2: false

overrides:
  esbuild: 0.28.1
