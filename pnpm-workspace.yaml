allowBuilds:
  '@tangle-network/browser-agent-driver': true
  better-sqlite3: true
  canvas: true
  cpu-features: false
  esbuild: true
  ffmpeg-static: false
  ssh2: false
  workerd: true

overrides:
  esbuild: 0.28.2
  'miniflare>undici': 7.30.1
  zod@4: 4.6.7
