name: Generated agent access

on:
  pull_request:
    paths:
      - 'create-agent-app/**'
      - 'src/operator/**'
      - 'src/agent-surfaces/**'
      - 'src/chat-routes/**'
      - 'src/chat-store/**'
      - 'src/turn-stream/**'
      - 'src/stream/**'
      - 'src/app-auth/**'
      - 'src/sandbox/**'
      - 'tests/create-agent-app*.test.ts'
      - 'tests/operator-*.test.ts'
      - 'tests/chat-routes/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.github/scripts/test-generated-projects.mjs'
      - '.github/workflows/generated-agent-access.yml'

permissions:
  contents: read

concurrency:
  group: generated-agent-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packed-consumer:
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERIFICATION_DIR: verification/generated-agent-access-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Protocol and admission regressions
        run: pnpm exec vitest run tests/operator-chat-adapter.test.ts tests/operator-api.test.ts tests/agent-surfaces.test.ts tests/chat-routes/turn-lock-history-fence.test.ts tests/chat-routes/backend-terminal-evidence.test.ts
      - name: Fresh packed consumers and single-browser proof
        run: pnpm run test:generated
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-agent-access-${{ github.event.pull_request.head.sha }}
          path: ${{ env.VERIFICATION_DIR }}
          if-no-files-found: warn
          retention-days: 1
