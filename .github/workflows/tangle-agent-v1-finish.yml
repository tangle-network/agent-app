name: Finish Tangle agent source
on:
  push:
    branches: [feat/default-agent-home]
    paths: [.github/workflows/tangle-agent-v1-finish.yml]
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/feat/default-agent-home'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}'}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc, cache: pnpm}
      - name: Apply the integration already built by run 36220462487
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, yaml
          workflow = yaml.safe_load(pathlib.Path('.github/workflows/tangle-agent-v1-build.yml').read_text())
          steps = workflow['jobs']['build']['steps']
          commands = {s['name']:s['run'] for s in steps if 'name' in s and 'run' in s}
          subprocess.run(['bash', '-e', '-c', commands['Complete the existing package surfaces']], check=True)
          subprocess.run(['git', 'restore', '--', '.github/workflows'], check=True)
          # Keep the same filesystem execution that already passed, not new unit-test ceremony.
          pathlib.Path('/tmp/exercise-home.sh').write_text(commands['Exercise the home command on a real filesystem'])
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:gen && pnpm typecheck && pnpm build
      - run: bash -e /tmp/exercise-home.sh
      - name: Publish only code and generated API documentation
        run: |
          git config user.name 'Tangle Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add src/hosted-agent/index.ts src/profile/home.ts src/profile/home-maintenance.ts docs
          git commit -m 'feat: wire and verify general-agent exports and bounded git home'
          git push origin HEAD:feat/default-agent-home
          git rev-parse HEAD
