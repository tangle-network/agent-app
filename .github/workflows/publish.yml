name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Main run that built the release artifact
        required: true
        type: string
      source_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      source_artifact_digest:
        description: GitHub SHA-256 artifact digest
        required: true
        type: string
      source_sha:
        description: Tested main commit
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package_release:
    uses: tangle-network/agent-app/.github/workflows/prepare-publish.yml@28c882cb570fa4103fd1265eb390090bfb86fee7
    permissions:
      contents: read
      actions: read
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_artifact_id: ${{ inputs.source_artifact_id }}
      source_artifact_digest: ${{ inputs.source_artifact_digest }}
      source_sha: ${{ inputs.source_sha }}

  write_release:
    needs: package_release
    if: >-
      always() &&
      needs.package_release.outputs.mode == 'auto' &&
      needs.package_release.result == 'success'
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    permissions:
      actions: write
      contents: write
    steps:
      - name: Commit version and dispatch tagged publication
        env:
          BASE_SHA: ${{ needs.package_release.outputs.base-sha }}
          VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.release-control-sha }}
          SOURCE_RUN_ID: ${{ needs.package_release.outputs.artifact-run-id }}
          SOURCE_ARTIFACT_ID: ${{ needs.package_release.outputs.artifact-id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.package_release.outputs.artifact-digest }}
          SOURCE_SHA: ${{ needs.package_release.outputs.base-sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BARE="$RUNNER_TEMP/release.git"
          git init --bare --quiet "$BARE"
          export GIT_DIR="$BARE" GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          unset AUTH
          git fetch --no-tags origin "$BASE_SHA"
          [[ $(git rev-parse FETCH_HEAD) == "$BASE_SHA" ]]
          git show "$BASE_SHA:.github/scripts/write-release.sh" > "$RUNNER_TEMP/write-release.sh"
          git show "$BASE_SHA:.github/scripts/next-release-version.mjs" > "$RUNNER_TEMP/next-release-version.mjs"
          [[ $(sha256sum "$RUNNER_TEMP/write-release.sh" | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          chmod 700 "$RUNNER_TEMP/write-release.sh"
          bash "$RUNNER_TEMP/write-release.sh"

  publish_agent_app:
    needs: package_release
    if: >-
      always() &&
      needs.package_release.result == 'success' &&
      needs.package_release.outputs.mode == 'tag' &&
      needs.package_release.outputs.agent-app-pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package_release.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.package_release.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true
      - name: Admit the release version
        uses: tangle-network/agent-runtime/.github/actions/admit-release@76b8de28191e31f0c1301a3621bab2188f8695e7
        with:
          tarballs: ${{ runner.temp }}/publish-bundle/agent-app.tgz

      - name: Publish exact Agent App tarball
        env:
          EXPECTED_VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.publish-control-sha }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish-bundle"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          [[ $(npm --version) == '11.16.0' ]]
          bash publish-packages.sh publish agent-app agent-app.tgz

  publish_create_agent_app:
    needs: [package_release, publish_agent_app]
    if: >-
      always() &&
      needs.package_release.result == 'success' &&
      needs.package_release.outputs.mode == 'tag' &&
      (needs.publish_agent_app.result == 'success' || needs.package_release.outputs.agent-app-pending == 'false') &&
      needs.package_release.outputs.create-agent-app-pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package_release.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.package_release.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true
      - name: Publish exact create-agent-app tarball
        env:
          EXPECTED_VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.publish-control-sha }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish-bundle"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          [[ $(npm --version) == '11.16.0' ]]
          bash publish-packages.sh publish create-agent-app create-agent-app.tgz

  safety_net_issue:
    needs: package_release
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.package_release.outputs.mode != 'skip' &&
      (
        needs.package_release.result == 'failure' ||
        needs.package_release.result == 'cancelled'
      )
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    permissions:
      issues: write
    steps:
      - name: File or append the safety-net failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Package artifact preparation failed on main'
          body="$(printf '%s\n' \
            "Commit \`$SHA\` failed package artifact preparation." \
            "" \
            "- run: $RUN_URL" \
            "- pushed by: @$ACTOR" \
            "" \
            "Inspect artifact preparation in the linked Publish run.")"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  safety_net_clear:
    needs: package_release
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.package_release.result == 'success' &&
      needs.package_release.outputs.mode == 'auto'
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    permissions:
      issues: write
    steps:
      - name: Close the safety-net issue once main is green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Package artifact preparation failed on main'
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          [[ -n "$number" ]] || {
            echo 'no open safety-net issue to clear'
            exit 0
          }
          gh issue close "$number" --reason completed --comment \
            "Green on main at \`$SHA\`: $RUN_URL"
