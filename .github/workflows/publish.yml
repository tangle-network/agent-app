name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package_release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'chore(release):') &&
       !contains(github.event.head_commit.message, '[skip release]')) ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      base-sha: ${{ github.sha }}
      control-sha: ${{ steps.control.outputs.sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag is current main tip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          [[ "$TAG_SHA" == "$MAIN_SHA" ]] || {
            echo "::error::Tag is at $TAG_SHA but main is at $MAIN_SHA. Re-cut the tag at current main."
            exit 1
          }
      - name: Stage publish control before dependency install
        id: control
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish-bundle"
          cp .github/scripts/publish-packages.sh "$RUNNER_TEMP/publish-bundle/publish-packages.sh"
          echo "sha=$(sha256sum "$RUNNER_TEMP/publish-bundle/publish-packages.sh" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check release contract
        run: |
          node .github/scripts/test-publish-workflow.mjs
          bash .github/scripts/test-publish-packages.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

      - name: Lock package version
        id: release
        run: |
          set -euo pipefail
          ROOT_VERSION=$(node -p "require('./package.json').version")
          CREATE_VERSION=$(node -p "require('./create-agent-app/package.json').version")
          if [[ "$ROOT_VERSION" != "$CREATE_VERSION" ]]; then
            echo "::error::Package version mismatch: agent-app=$ROOT_VERSION create-agent-app=$CREATE_VERSION."
            exit 1
          fi

          MODE='verify-only'
          VERSION=$ROOT_VERSION
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MODE='tag'
            if [[ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
              echo "::error::Tag/version mismatch: tag=${GITHUB_REF#refs/tags/v} package=$VERSION."
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            MODE='auto'
            npm version patch --no-git-tag-version --ignore-scripts >/dev/null
            VERSION=$(node -p "require('./package.json').version")
            npm version "$VERSION" --prefix create-agent-app --no-git-tag-version --ignore-scripts >/dev/null
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: pnpm run build

      - name: Pack and inspect exact tarballs
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/publish-bundle"
          rm -f "$BUNDLE"/*.tgz "$BUNDLE/SHA256SUMS"

          pack() {
            local source=$1 output=$2 packed
            packed=$(npm pack "$source" --ignore-scripts --pack-destination "$BUNDLE")
            [[ -f "$BUNDLE/$packed" ]] || { echo "::error::npm pack did not create $packed."; exit 1; }
            mv "$BUNDLE/$packed" "$BUNDLE/$output"
          }
          pack . agent-app.tgz
          pack ./create-agent-app create-agent-app.tgz

          EXPECTED_VERSION="$RELEASE_VERSION" \
            bash "$BUNDLE/publish-packages.sh" validate \
            "$BUNDLE/agent-app.tgz" "$BUNDLE/create-agent-app.tgz"
          npm publish "$BUNDLE/agent-app.tgz" --dry-run --ignore-scripts --access public >/dev/null
          npm publish "$BUNDLE/create-agent-app.tgz" --dry-run --ignore-scripts --access public >/dev/null
          (
            cd "$BUNDLE"
            sha256sum agent-app.tgz create-agent-app.tgz publish-packages.sh > SHA256SUMS
          )
      - name: Upload release artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publish-bundle/agent-app.tgz
            ${{ runner.temp }}/publish-bundle/create-agent-app.tgz
            ${{ runner.temp }}/publish-bundle/publish-packages.sh
            ${{ runner.temp }}/publish-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  write_release:
    needs: package_release
    if: needs.package_release.outputs.mode == 'auto'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Commit version and tag atomically
        id: release
        env:
          BASE_SHA: ${{ needs.package_release.outputs.base-sha }}
          VERSION: ${{ needs.package_release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'released=false' >> "$GITHUB_OUTPUT"
          BARE="$RUNNER_TEMP/release.git"
          git init --bare --quiet "$BARE"
          export GIT_DIR="$BARE" GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          unset GITHUB_TOKEN AUTH
          remote_ref() { git ls-remote origin "$1" | awk 'NR == 1 { print $1 }'; }

          REMOTE_MAIN=$(remote_ref refs/heads/main)
          [[ -n "$REMOTE_MAIN" ]] || { echo '::error::Unable to resolve origin/main.'; exit 1; }
          if [[ "$REMOTE_MAIN" != "$BASE_SHA" ]]; then
            echo "::notice::main advanced from tested commit $BASE_SHA to $REMOTE_MAIN; no version or tag was written."
            exit 0
          fi
          if [[ -n $(remote_ref "refs/tags/v$VERSION") ]]; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          [[ $(git rev-parse FETCH_HEAD) == "$BASE_SHA" ]]
          git show "$BASE_SHA:package.json" > "$RUNNER_TEMP/package.json"
          git show "$BASE_SHA:create-agent-app/package.json" > "$RUNNER_TEMP/create-package.json"
          VERSION="$VERSION" node - "$RUNNER_TEMP/package.json" "$RUNNER_TEMP/create-package.json" <<'NODE'
          const fs = require('node:fs')
          const files = process.argv.slice(2)
          const manifests = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')))
          if (manifests[0].name !== '@tangle-network/agent-app' || manifests[1].name !== '@tangle-network/create-agent-app') throw new Error('unexpected package names')
          if (manifests[0].version !== manifests[1].version) throw new Error('base package versions differ')
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(manifests[0].version)
          const next = match && `${match[1]}.${match[2]}.${BigInt(match[3]) + 1n}`
          if (next !== process.env.VERSION) throw new Error(`expected next patch ${String(next)}, found ${process.env.VERSION}`)
          for (let index = 0; index < files.length; index += 1) {
            manifests[index].version = process.env.VERSION
            fs.writeFileSync(files[index], `${JSON.stringify(manifests[index], null, 2)}\n`)
          }
          NODE

          ROOT_BLOB=$(git hash-object -w "$RUNNER_TEMP/package.json")
          CREATE_BLOB=$(git hash-object -w "$RUNNER_TEMP/create-package.json")
          git read-tree "$BASE_SHA^{tree}"
          git update-index --cacheinfo "100644,$ROOT_BLOB,package.json"
          git update-index --cacheinfo "100644,$CREATE_BLOB,create-agent-app/package.json"
          TREE=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
          COMMIT=$(printf 'chore(release): %s [skip release]\n' "$VERSION" | git commit-tree "$TREE" -p "$BASE_SHA")
          git update-ref refs/heads/release "$COMMIT"
          git update-ref "refs/tags/v$VERSION" "$COMMIT"

          for attempt in 1 2 3; do
            if git push --atomic origin refs/heads/release:refs/heads/main "refs/tags/v$VERSION:refs/tags/v$VERSION"; then
              echo 'released=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MAIN=$(remote_ref refs/heads/main)
            TAG=$(remote_ref "refs/tags/v$VERSION")
            if [[ "$MAIN" == "$COMMIT" && "$TAG" == "$COMMIT" ]]; then
              echo 'released=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$MAIN" != "$BASE_SHA" && -z "$TAG" ]]; then
              echo "::notice::main advanced to $MAIN; atomic push left the tag unchanged."
              exit 0
            fi
            [[ "$MAIN" == "$BASE_SHA" && -z "$TAG" ]] || { echo '::error::Remote refs are not atomic.'; exit 1; }
            sleep "$attempt"
          done
          echo '::error::Atomic release push failed 3 times.'
          exit 1

  publish_agent_app:
    needs: [package_release, write_release]
    if: >-
      always() && needs.package_release.result == 'success' &&
      (needs.package_release.outputs.mode == 'tag' ||
       (needs.package_release.outputs.mode == 'auto' &&
        needs.write_release.outputs.released == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package_release.outputs.artifact-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true
      - name: Publish exact Agent App tarball
        env:
          EXPECTED_VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.control-sha }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish-bundle"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          [[ $(npm --version) == '11.16.0' ]]
          bash publish-packages.sh publish agent-app agent-app.tgz

  publish_create_agent_app:
    needs: [package_release, write_release]
    if: >-
      always() && needs.package_release.result == 'success' &&
      (needs.package_release.outputs.mode == 'tag' ||
       (needs.package_release.outputs.mode == 'auto' &&
        needs.write_release.outputs.released == 'true'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package_release.outputs.artifact-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true
      - name: Publish exact create-agent-app tarball
        env:
          EXPECTED_VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.control-sha }}
          CREATE_AGENT_APP_NPM_TOKEN: ${{ secrets.CREATE_AGENT_APP_NPM_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish-bundle"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          [[ $(npm --version) == '11.16.0' ]]
          bash publish-packages.sh publish create-agent-app create-agent-app.tgz
