name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Main run that built the release artifact
        required: true
        type: string
      source_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      source_artifact_digest:
        description: GitHub SHA-256 artifact digest
        required: true
        type: string
      source_sha:
        description: Tested main commit
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package_release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'chore(release):') &&
       !contains(github.event.head_commit.message, '[skip release]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      base-sha: ${{ steps.release.outputs.base-sha }}
      publish-control-sha: ${{ steps.control.outputs.publish-sha }}
      release-control-sha: ${{ steps.control.outputs.release-sha }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-run-id: ${{ steps.artifact.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage release controls
        id: control
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish-bundle"
          cp .github/scripts/publish-packages.sh "$RUNNER_TEMP/publish-bundle/publish-packages.sh"
          cp .github/scripts/read-npm-pack-filename.mjs "$RUNNER_TEMP/publish-bundle/read-npm-pack-filename.mjs"
          {
            echo "publish-sha=$(sha256sum "$RUNNER_TEMP/publish-bundle/publish-packages.sh" | cut -d' ' -f1)"
            echo "pack-sha=$(sha256sum "$RUNNER_TEMP/publish-bundle/read-npm-pack-filename.mjs" | cut -d' ' -f1)"
            echo "release-sha=$(sha256sum .github/scripts/write-release.sh | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Lock release identity
        id: release
        run: |
          set -euo pipefail
          ROOT_VERSION=$(node -p "require('./package.json').version")
          CREATE_VERSION=$(node -p "require('./create-agent-app/package.json').version")
          [[ "$ROOT_VERSION" == "$CREATE_VERSION" ]] || {
            echo "::error::Package version mismatch: agent-app=$ROOT_VERSION create-agent-app=$CREATE_VERSION."
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == refs/tags/v* ]] || {
              echo '::error::Manual publication requires a release tag.'
              exit 1
            }
            MODE='tag'
            VERSION=$ROOT_VERSION
            RELEASE_SHA=$(git rev-parse HEAD)
            BASE_SHA=$(git rev-parse "$RELEASE_SHA^")
            [[ "${GITHUB_REF#refs/tags/v}" == "$VERSION" ]] || {
              echo "::error::Tag/version mismatch: tag=${GITHUB_REF#refs/tags/v} package=$VERSION."
              exit 1
            }
          else
            MODE='auto'
            BASE_SHA=$GITHUB_SHA
            VERSION=$(ROOT_VERSION="$ROOT_VERSION" node -e "
              const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(process.env.ROOT_VERSION)
              if (!match) process.exit(1)
              process.stdout.write(match[1] + '.' + match[2] + '.' + (BigInt(match[3]) + 1n))
            ")
          fi

          {
            echo "mode=$MODE"
            echo "version=$VERSION"
            echo "base-sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag is on main
        if: steps.release.outputs.mode == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA" || {
            echo "::error::Tag $TAG_SHA is not on main at $MAIN_SHA."
            exit 1
          }

      - name: Validate exact release commit
        if: steps.release.outputs.mode == 'tag'
        env:
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          BASE_SHA="$BASE_SHA" VERSION="$VERSION" RELEASE_SHA="$RELEASE_SHA" \
            bash .github/scripts/write-release.sh validate

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check release contract
        run: |
          node .github/scripts/test-publish-workflow.mjs
          bash .github/scripts/test-publish-packages.sh
          bash .github/scripts/test-write-release.sh

      - name: Install dependencies
        if: steps.release.outputs.mode == 'auto'
        run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Typecheck source
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run typecheck
      - name: Incident-class gates
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run test:gates
      - name: Prepare release manifests
        if: steps.release.outputs.mode == 'auto'
        env:
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/write-release.sh prepare
      - name: Build release
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run build
      - name: Test source
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run test
      - name: Test clean generated projects
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run test:generated
      - name: Check dead surface
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run knip

      - name: Configure exact artifact pack runtime
        if: steps.release.outputs.mode == 'auto'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify artifact pack npm
        if: steps.release.outputs.mode == 'auto'
        run: "[[ $(npm --version) == '11.16.0' ]]"

      - name: Pack and inspect exact tarballs
        if: steps.release.outputs.mode == 'auto'
        env:
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          PACK_CONTROL_SHA: ${{ steps.control.outputs.pack-sha }}
          PUBLISH_CONTROL_SHA: ${{ steps.control.outputs.publish-sha }}
          RELEASE_CONTROL_SHA: ${{ steps.control.outputs.release-sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/publish-bundle"
          rm -f "$BUNDLE"/*.tgz "$BUNDLE/SHA256SUMS" "$BUNDLE/RELEASE_PROVENANCE"
          [[ $(sha256sum "$BUNDLE/read-npm-pack-filename.mjs" | cut -d' ' -f1) == "$PACK_CONTROL_SHA" ]]

          pack() {
            local source=$1 output=$2 packed
            packed=$(npm pack "$source" --ignore-scripts --pack-destination "$BUNDLE" --json |
              node "$BUNDLE/read-npm-pack-filename.mjs")
            [[ -f "$BUNDLE/$packed" ]] || {
              echo "::error::npm pack did not create $packed."
              exit 1
            }
            mv "$BUNDLE/$packed" "$BUNDLE/$output"
          }
          pack . agent-app.tgz
          pack ./create-agent-app create-agent-app.tgz

          EXPECTED_VERSION="$RELEASE_VERSION" \
            bash "$BUNDLE/publish-packages.sh" validate \
            "$BUNDLE/agent-app.tgz" "$BUNDLE/create-agent-app.tgz"
          npm publish "$BUNDLE/agent-app.tgz" --dry-run --ignore-scripts --access public >/dev/null
          npm publish "$BUNDLE/create-agent-app.tgz" --dry-run --ignore-scripts --access public >/dev/null
          printf '%s\n' \
            'format=1' \
            "base_sha=$BASE_SHA" \
            "version=$RELEASE_VERSION" \
            "source_run_id=$GITHUB_RUN_ID" \
            "publish_control_sha=$PUBLISH_CONTROL_SHA" \
            "release_control_sha=$RELEASE_CONTROL_SHA" > "$BUNDLE/RELEASE_PROVENANCE"
          (
            cd "$BUNDLE"
            sha256sum agent-app.tgz create-agent-app.tgz publish-packages.sh RELEASE_PROVENANCE > SHA256SUMS
          )

      - name: Upload release artifact
        if: steps.release.outputs.mode == 'auto'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publish-bundle/agent-app.tgz
            ${{ runner.temp }}/publish-bundle/create-agent-app.tgz
            ${{ runner.temp }}/publish-bundle/publish-packages.sh
            ${{ runner.temp }}/publish-bundle/RELEASE_PROVENANCE
            ${{ runner.temp }}/publish-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Resolve source artifact
        id: artifact
        env:
          INPUT_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
          INPUT_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          UPLOAD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.release.outputs.mode }}" == 'auto' ]]; then
            ARTIFACT_RUN_ID=$GITHUB_RUN_ID
            ARTIFACT_ID=$UPLOAD_ARTIFACT_ID
            ARTIFACT_DIGEST=$UPLOAD_ARTIFACT_DIGEST
            SOURCE_SHA=${{ steps.release.outputs.base-sha }}
          else
            ARTIFACT_RUN_ID=$INPUT_RUN_ID
            ARTIFACT_ID=$INPUT_ARTIFACT_ID
            ARTIFACT_DIGEST=$INPUT_ARTIFACT_DIGEST
            SOURCE_SHA=$INPUT_SOURCE_SHA
          fi
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Source run ID must be a positive integer.'
            exit 1
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Source artifact ID must be a positive integer.'
            exit 1
          }
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Source artifact digest must be SHA-256.'
            exit 1
          }
          [[ "$SOURCE_SHA" == "${{ steps.release.outputs.base-sha }}" ]] || {
            echo '::error::Source SHA does not match the release parent.'
            exit 1
          }
          {
            echo "artifact-run-id=$ARTIFACT_RUN_ID"
            echo "artifact-id=$ARTIFACT_ID"
            echo "artifact-digest=$ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Verify source artifact identity
        if: steps.release.outputs.mode == 'tag'
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_RUN_ID: ${{ steps.artifact.outputs.artifact-run-id }}
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          METADATA=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          [[ $(jq -r '.id' <<< "$METADATA") == "$ARTIFACT_ID" ]]
          [[ $(jq -r '.workflow_run.id // empty' <<< "$METADATA") == "$ARTIFACT_RUN_ID" ]]
          [[ $(jq -r '.workflow_run.head_branch // empty' <<< "$METADATA") == 'main' ]]
          [[ $(jq -r '.workflow_run.head_sha // empty' <<< "$METADATA") == "$BASE_SHA" ]]
          [[ $(jq -r '.digest // empty' <<< "$METADATA") == "$ARTIFACT_DIGEST" ]]
          [[ $(jq -r '.expired' <<< "$METADATA") == 'false' ]]

      - name: Download source artifact
        if: steps.release.outputs.mode == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true

      - name: Verify source artifact files
        if: steps.release.outputs.mode == 'tag'
        env:
          ARTIFACT_RUN_ID: ${{ steps.artifact.outputs.artifact-run-id }}
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_CONTROL_SHA: ${{ steps.control.outputs.publish-sha }}
          RELEASE_CONTROL_SHA: ${{ steps.control.outputs.release-sha }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/publish-bundle"
          cd "$BUNDLE"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$PUBLISH_CONTROL_SHA" ]]
          EXPECTED="$RUNNER_TEMP/expected-release-provenance"
          printf '%s\n' \
            'format=1' \
            "base_sha=$BASE_SHA" \
            "version=$EXPECTED_VERSION" \
            "source_run_id=$ARTIFACT_RUN_ID" \
            "publish_control_sha=$PUBLISH_CONTROL_SHA" \
            "release_control_sha=$RELEASE_CONTROL_SHA" > "$EXPECTED"
          cmp "$EXPECTED" RELEASE_PROVENANCE
          bash publish-packages.sh validate agent-app.tgz create-agent-app.tgz

  write_release:
    needs: package_release
    if: needs.package_release.outputs.mode == 'auto'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Commit version and dispatch tagged publication
        env:
          BASE_SHA: ${{ needs.package_release.outputs.base-sha }}
          VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.release-control-sha }}
          SOURCE_RUN_ID: ${{ needs.package_release.outputs.artifact-run-id }}
          SOURCE_ARTIFACT_ID: ${{ needs.package_release.outputs.artifact-id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.package_release.outputs.artifact-digest }}
          SOURCE_SHA: ${{ needs.package_release.outputs.base-sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BARE="$RUNNER_TEMP/release.git"
          git init --bare --quiet "$BARE"
          export GIT_DIR="$BARE" GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          unset AUTH
          git fetch --no-tags origin "$BASE_SHA"
          [[ $(git rev-parse FETCH_HEAD) == "$BASE_SHA" ]]
          git show "$BASE_SHA:.github/scripts/write-release.sh" > "$RUNNER_TEMP/write-release.sh"
          [[ $(sha256sum "$RUNNER_TEMP/write-release.sh" | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          chmod 700 "$RUNNER_TEMP/write-release.sh"
          bash "$RUNNER_TEMP/write-release.sh"

  publish_agent_app:
    needs: package_release
    if: needs.package_release.outputs.mode == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package_release.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.package_release.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true
      - name: Publish exact Agent App tarball
        env:
          EXPECTED_VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.publish-control-sha }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish-bundle"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          [[ $(npm --version) == '11.16.0' ]]
          bash publish-packages.sh publish agent-app agent-app.tgz

  publish_create_agent_app:
    needs: package_release
    if: needs.package_release.outputs.mode == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package_release.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.package_release.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true
      - name: Publish exact create-agent-app tarball
        env:
          EXPECTED_VERSION: ${{ needs.package_release.outputs.version }}
          CONTROL_SHA: ${{ needs.package_release.outputs.publish-control-sha }}
          CREATE_AGENT_APP_NPM_TOKEN: ${{ secrets.CREATE_AGENT_APP_NPM_TOKEN }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish-bundle"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$CONTROL_SHA" ]]
          [[ $(npm --version) == '11.16.0' ]]
          bash publish-packages.sh publish create-agent-app create-agent-app.tgz

  safety_net_issue:
    needs: package_release
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.package_release.result == 'failure' || needs.package_release.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or append the safety-net failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Post-merge safety net is red on main'
          body="$(printf '%s\n' \
            "Commit \`$SHA\` failed the post-merge safety net." \
            "" \
            "- run: $RUN_URL" \
            "- pushed by: @$ACTOR" \
            "" \
            "Reproduce with: pnpm signoff --source head")"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  safety_net_clear:
    needs: package_release
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.package_release.result == 'success' && needs.package_release.outputs.mode == 'auto'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the safety-net issue once main is green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Post-merge safety net is red on main'
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          [[ -n "$number" ]] || {
            echo 'no open safety-net issue to clear'
            exit 0
          }
          gh issue close "$number" --reason completed --comment \
            "Green on main at \`$SHA\`: $RUN_URL"
