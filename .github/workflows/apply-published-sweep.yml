name: Apply published sweep
on:
  push:
    branches: ['sweep1/published-platform-capabilities']
    paths: ['.github/scripts/apply-published-sweep.py', '.github/workflows/apply-published-sweep.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/sweep1/published-platform-capabilities'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOF_DIR: /tmp/app-published-sweep
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply source migration
        run: |
          mkdir -p "$PROOF_DIR"
          python3 .github/scripts/apply-published-sweep.py
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install and build published dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$PROOF_DIR/install.log"
          pnpm build 2>&1 | tee "$PROOF_DIR/build.log"
          pnpm docs:gen 2>&1 | tee "$PROOF_DIR/docs.log"
      - name: Commit bounded migration and generated API docs
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-published-sweep.py .github/workflows/apply-published-sweep.yml
          git add src/tools/openai.ts src/turn-health/sink.ts tests/integrations.test.ts examples/hosted-agent/src/worker.ts examples/hosted-agent/package.json docs/api/tools.md docs/codemap.json docs/llms-full.txt
          git diff --cached --check
          git -c core.hooksPath=/dev/null -c user.name=drewstone -c user.email=drewstone329@gmail.com commit -m 'refactor(platform): remove copied Hub, Slack and runtime tool contracts'
          git rev-parse HEAD > "$PROOF_DIR/commit.txt"
          git archive --format=tar.gz HEAD > "$PROOF_DIR/source.tar.gz"
      - name: Push only this migration branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/sweep1/published-platform-capabilities
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/sweep1/published-platform-capabilities
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-sweep-source-and-build
          path: /tmp/app-published-sweep/
          retention-days: 7
