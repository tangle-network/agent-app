name: Channels completion source
on:
  push:
    branches: [pro/channels-kit]
    paths: [.github/workflows/channels-completion-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06dfe58083ce8da9b11a09d6607c8040eb050c13
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Capture developer prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/deps"
          pnpm add -D @tangle-network/hub-sdk@0.19.2 --ignore-scripts > "$RUNNER_TEMP/source/install.log" 2>&1
          pnpm install >> "$RUNNER_TEMP/source/install.log" 2>&1
          cp pnpm-lock.yaml "$RUNNER_TEMP/source/pnpm-lock.yaml"
          cp package.json "$RUNNER_TEMP/source/package.json"
          git bundle create "$RUNNER_TEMP/source/source.bundle" --all
          cp "$(command -v node)" "$RUNNER_TEMP/source/node24"
          npm pack pnpm@11.24.0 --pack-destination "$RUNNER_TEMP/source"
          tar -czf "$RUNNER_TEMP/dependencies.tar.gz" node_modules
          split -b 280M -d "$RUNNER_TEMP/dependencies.tar.gz" "$RUNNER_TEMP/deps/deps-"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channels-development-source
          path: ${{ runner.temp }}/source
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: channels-deps-00
          path: ${{ runner.temp }}/deps/deps-00
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: channels-deps-01
          path: ${{ runner.temp }}/deps/deps-01
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: channels-deps-02
          path: ${{ runner.temp }}/deps/deps-02
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: channels-deps-03
          path: ${{ runner.temp }}/deps/deps-03
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: channels-deps-04
          path: ${{ runner.temp }}/deps/deps-04
          retention-days: 3
          compression-level: 0
