name: Complete principal source qualification
on:
  push:
    branches: [delivery/principal-app-20260929]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      RECEIPTS: /tmp/principal-app-final
      SOURCE: a9e3c7c0bdbe290a4e3132ab9be4248daa6a3e22
      UPSTREAM: ff4ccd6305c4278eb156051ef90b1505c9af9971
      FEATURE: refactor/exact-recovery-and-turn-identity-20260929
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a9e3c7c0bdbe290a4e3132ab9be4248daa6a3e22
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile the known upstream release without overwriting source
        run: |
          mkdir -p "$RECEIPTS"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-commit --no-ff "$UPSTREAM"
          git diff --cached --check
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install the real current locked cohort
        run: pnpm install --frozen-lockfile --ignore-scripts=false > "$RECEIPTS/install.log" 2>&1 || { tail -80 "$RECEIPTS/install.log"; exit 1; }
      - name: Generate and stage the maintained API documentation
        run: |
          pnpm docs:gen > "$RECEIPTS/docs.log" 2>&1
          git add docs
          git diff --cached --check
          git diff --cached --stat
      - name: Publish only reconciled release files and generated documentation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict');
            const {owner,repo}=context.repo;
            const current=await github.rest.git.getRef({owner,repo,ref:`heads/${process.env.FEATURE}`});
            assert.equal(current.data.object.sha,process.env.SOURCE,'Feature advanced; refuse stale publication');
            const allowed=new Set(['CHANGELOG.md','package.json','create-agent-app/package.json','docs/api/stream.md','docs/codemap.json','docs/llms-full.txt']);
            const changed=cp.execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
            assert.ok(changed.length>0);
            const parent=await github.rest.git.getCommit({owner,repo,commit_sha:process.env.SOURCE});
            const entries=[];
            for(const file of changed){
              assert.ok(allowed.has(file),`Unexpected generated path: ${file}`);
              const blob=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file).toString('base64'),encoding:'base64'});
              entries.push({path:file,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const tree=await github.rest.git.createTree({owner,repo,base_tree:parent.data.tree.sha,tree:entries});
            assert.equal(tree.data.sha,cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim());
            const commit=await github.rest.git.createCommit({owner,repo,message:'chore: reconcile released base and regenerate turn API references',tree:tree.data.sha,parents:[process.env.SOURCE,process.env.UPSTREAM]});
            const rechecked=await github.rest.git.getRef({owner,repo,ref:`heads/${process.env.FEATURE}`});
            assert.equal(rechecked.data.object.sha,process.env.SOURCE,'Feature advanced before update');
            await github.rest.git.updateRef({owner,repo,ref:`heads/${process.env.FEATURE}`,sha:commit.data.sha,force:false});
            const receipt={repository:`${owner}/${repo}`,head:commit.data.sha,tree:tree.data.sha,parents:[process.env.SOURCE,process.env.UPSTREAM],files:changed,run:context.runId};
            fs.writeFileSync(path.join(process.env.RECEIPTS,'source.json'),JSON.stringify(receipt,null,2));
            console.log(JSON.stringify(receipt));
      - name: Verify the committed source, not an uncommitted candidate
        run: |
          git merge --abort
          git fetch origin "$FEATURE"
          git checkout --detach FETCH_HEAD
          EXPECTED=$(python3 -c 'import json,os; print(json.load(open(os.environ["RECEIPTS"]+"/source.json"))["head"])')
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          pnpm signoff --source head > "$RECEIPTS/signoff.log" 2>&1 || { tail -160 "$RECEIPTS/signoff.log"; exit 1; }
      - name: Retain committed source and all proof receipts
        if: always()
        run: |
          git rev-parse HEAD > "$RECEIPTS/checkout.txt"
          git archive --format=tar.gz HEAD > "$RECEIPTS/source.tar.gz"
          for DIR in .signoff .agent-app/signoff .agent-app-signoff; do
            if test -d "$DIR"; then cp -R "$DIR" "$RECEIPTS/"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: principal-app-final-${{ github.run_id }}
          path: ${{ env.RECEIPTS }}/
          include-hidden-files: true
          retention-days: 7
