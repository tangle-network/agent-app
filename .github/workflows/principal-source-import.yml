name: Import reviewed principal source
on:
  push:
    branches: [delivery/principal-app-20260929]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      RECEIPTS: /tmp/principal-source-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only exact reviewed source preimages
        run: |
          mkdir -p "$RECEIPTS"
          cp .delivery/principal.json "$RECEIPTS/manifest.json"
          cp .delivery/principal.patch.gz.b64 "$RECEIPTS/patch.gz.b64"
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RECEIPTS'])
          manifest=json.loads((root/'manifest.json').read_text())
          patch=gzip.decompress(base64.b64decode((root/'patch.gz.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()==manifest['patchSha256']
          subprocess.run(['git','checkout','--detach',manifest['base']],check=True)
          for path,hashes in manifest['files'].items():
            assert path.startswith(('src/','tests/')) and '..' not in pathlib.PurePosixPath(path).parts
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip() if pathlib.Path(path).exists() else None
            assert actual==hashes['before'],f'Changed preimage: {path}'
          (root/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(root/'source.patch')],check=True)
          subprocess.run(['git','apply','--index',str(root/'source.patch')],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          for path,hashes in manifest['files'].items():
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==hashes['after'],path
          PY
      - name: Publish ordinary source branch without importer ancestry
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs=require('node:fs'), path=require('node:path'), cp=require('node:child_process'), assert=require('node:assert/strict');
            const manifest=JSON.parse(fs.readFileSync(path.join(process.env.RECEIPTS,'manifest.json'),'utf8'));
            const {owner,repo}=context.repo;
            assert.equal(`${owner}/${repo}`,manifest.repository);
            const changed=cp.execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n').sort();
            assert.deepEqual(changed,Object.keys(manifest.files).sort());
            const parent=await github.rest.git.getCommit({owner,repo,commit_sha:manifest.base});
            const entries=[];
            for(const file of changed){
              const blob=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(file).toString('base64'),encoding:'base64'});
              assert.equal(blob.data.sha,manifest.files[file].after);
              entries.push({path:file,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const tree=await github.rest.git.createTree({owner,repo,base_tree:parent.data.tree.sha,tree:entries});
            assert.equal(tree.data.sha,cp.execFileSync('git',['write-tree'],{encoding:'utf8'}).trim());
            let existing;
            try{existing=await github.rest.git.getRef({owner,repo,ref:`heads/${manifest.branch}`});}catch(e){if(e.status!==404)throw e;}
            let sha;
            if(existing){
              const commit=await github.rest.git.getCommit({owner,repo,commit_sha:existing.data.object.sha});
              assert.equal(commit.data.tree.sha,tree.data.sha,'Existing branch changed; no overwrite');
              sha=commit.data.sha;
            }else{
              const commit=await github.rest.git.createCommit({owner,repo,message:manifest.message,tree:tree.data.sha,parents:[manifest.base]});
              sha=commit.data.sha;
              await github.rest.git.createRef({owner,repo,ref:`refs/heads/${manifest.branch}`,sha});
            }
            const receipt={repository:manifest.repository,parent:manifest.base,head:sha,tree:tree.data.sha,branch:manifest.branch,files:changed,run:context.runId,verification:'Exact preimage, patch digest, resulting file hashes and Git tree; source publication only'};
            fs.writeFileSync(path.join(process.env.RECEIPTS,'source.json'),JSON.stringify(receipt,null,2));
            console.log(JSON.stringify(receipt));
            await core.summary.addHeading('Published ordinary source').addCodeBlock(JSON.stringify(receipt,null,2),'json').write();
      - name: Checkout published source
        run: |
          BRANCH=$(python3 -c 'import json,os; print(json.load(open(os.environ["RECEIPTS"]+"/source.json"))["branch"])')
          git fetch origin "$BRANCH"
          git checkout --detach FETCH_HEAD
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install the actual locked package cohort
        run: pnpm install --frozen-lockfile --ignore-scripts=false > "$RECEIPTS/install.log" 2>&1 || { tail -80 "$RECEIPTS/install.log"; exit 1; }
      - name: Generate maintained API documentation
        run: |
          pnpm docs:gen > "$RECEIPTS/docs.log" 2>&1
          git diff -- docs > "$RECEIPTS/docs.patch"
          git diff --stat -- docs
      - name: Verify actual source types and targeted contracts
        run: |
          pnpm typecheck > "$RECEIPTS/typecheck.log" 2>&1 || { tail -100 "$RECEIPTS/typecheck.log"; exit 1; }
          pnpm exec vitest run src/sandbox/recovery.test.ts src/sandbox/recovery-transitions.test.ts src/stream/turn-identity-readonly.test.ts tests/chat-routes --maxWorkers=2 > "$RECEIPTS/tests.log" 2>&1 || { tail -100 "$RECEIPTS/tests.log"; exit 1; }
      - name: Retain source and verification boundary
        if: always()
        run: |
          git rev-parse HEAD > "$RECEIPTS/checkout.txt"
          git archive --format=tar.gz HEAD > "$RECEIPTS/source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: principal-source-${{ github.run_id }}
          path: ${{ env.RECEIPTS }}/
          retention-days: 7
