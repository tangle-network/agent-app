name: Adopt stack

on:
  workflow_dispatch:
    inputs:
      merge:
        description: Merge the adoption PR when its gate passes
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@97099c2bee8a59f2d998a640b581ba05ebdf0cc6
    with:
      stack-ref: 97099c2bee8a59f2d998a640b581ba05ebdf0cc6
      gate: pnpm install --frozen-lockfile && pnpm typecheck && pnpm exec vitest run tests/chat-routes/computer-lane.integration.test.ts tests/chat-routes/hybrid-fallback.integration.test.ts tests/chat-routes/default-assembly.integration.test.ts
      runs-on: '["self-hosted", "beelink"]'
      default-branch: main
      merge: ${{ inputs.merge }}
    secrets: inherit
