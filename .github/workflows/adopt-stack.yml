name: Adopt stack

on:
  workflow_dispatch:
    inputs:
      merge:
        description: Merge the adoption PR when its gate passes
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  adopt:
    uses: tangle-network/agent-eval/.github/workflows/adopt-stack.yml@aa7158aad768ee59647472d96c9b1b8b0aa3cf1c
    with:
      stack-ref: aa7158aad768ee59647472d96c9b1b8b0aa3cf1c
      post-pin: node src/theme/build.mjs --write
      gate: pnpm install --frozen-lockfile && pnpm run build && pnpm typecheck && pnpm exec vitest run tests/chat-routes/computer-lane.integration.test.ts tests/chat-routes/hybrid-fallback.integration.test.ts tests/chat-routes/default-assembly.integration.test.ts
      runs-on: '["self-hosted", "beelink"]'
      default-branch: main
      merge: ${{ inputs.merge }}
    secrets: inherit
