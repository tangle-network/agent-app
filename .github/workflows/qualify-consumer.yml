name: Qualify published Agent App consumer
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      feature_branch:
        required: true
        type: string
      manifests:
        required: false
        default: '["package.json"]'
        type: string
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      FEATURE_BRANCH: ${{ inputs.feature_branch }}
      MANIFESTS: ${{ inputs.manifests }}
      APP_VERSION: 0.51.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify immutable source and the actual published package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer-proof"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          pnpm view "@tangle-network/agent-app@$APP_VERSION" version dist.integrity --json > "$RUNNER_TEMP/consumer-proof/registry.json"
          git rev-parse HEAD > "$RUNNER_TEMP/consumer-proof/baseline.txt"
      - name: Adopt the published release through the native package manager
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          changed=[]
          for name in json.loads(os.environ['MANIFESTS']):
            p=pathlib.Path(name)
            assert not p.is_absolute() and '..' not in p.parts and p.name=='package.json'
            subprocess.run(['git','ls-files','--error-unmatch',str(p)],check=True,stdout=subprocess.DEVNULL)
            data=json.loads(p.read_text()); found=False
            for field in ['dependencies','devDependencies','peerDependencies']:
              if '@tangle-network/agent-app' in data.get(field,{}):
                data[field]['@tangle-network/agent-app']=os.environ['APP_VERSION']; found=True
            if found:
              p.write_text(json.dumps(data,indent=2)+'\n'); changed.append(str(p))
          assert changed,'No declared Agent App consumer in the allowed manifests'
          pathlib.Path(os.environ['RUNNER_TEMP'],'consumer-proof','manifests.json').write_text(json.dumps(changed))
          PY
          pnpm install --no-frozen-lockfile --ignore-scripts=false > "$RUNNER_TEMP/consumer-proof/install.log" 2>&1 || { tail -120 "$RUNNER_TEMP/consumer-proof/install.log"; exit 1; }
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          paths=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'consumer-proof','manifests.json').read_text())
          locks=[p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if pathlib.PurePosixPath(p).name=='pnpm-lock.yaml']
          subprocess.run(['git','add','--',*paths,*locks],check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): adopt published Agent App 0.51.8'
            git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/consumer-proof/commit.txt"
          git diff --binary > "$RUNNER_TEMP/consumer-proof/unstaged.patch"
          git archive HEAD | gzip > "$RUNNER_TEMP/consumer-proof/source.tar.gz"
      - name: Verify the installed export in every admitted consumer
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          paths=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'consumer-proof','manifests.json').read_text())
          script='const m=await import("@tangle-network/agent-app/chat-routes"); if(typeof m.produceChatTurnWithIntelligence!=="function" || typeof m.observeChatTurnStream!=="function") throw Error("Published shared observer is missing")'
          for p in paths:
            subprocess.run(['node','--input-type=module','-e',script],cwd=pathlib.Path(p).parent,check=True)
          PY
      - name: Execute the repository's unchanged committed-source signoff
        run: pnpm signoff --source head --keep-going --json "$RUNNER_TEMP/consumer-proof/signoff.json" > "$RUNNER_TEMP/consumer-proof/signoff.log" 2>&1 || { tail -120 "$RUNNER_TEMP/consumer-proof/signoff.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shared-improvement-consumer-proof
          path: ${{ runner.temp }}/consumer-proof/
          retention-days: 7
