name: Qualify shared improvement source
on:
  push:
    branches: [verify/shared-agent-improvement-20261002]
permissions:
  contents: write
concurrency:
  group: qualify-shared-improvement
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 9d17b5e526ffd5ce7a8adbb1866ce9f5912a1a83
      FEATURE_BRANCH: feat/shared-agent-improvement-20261002
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Record and verify source
        run: |
          mkdir -p "$RUNNER_TEMP/shared-proof"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/shared-proof/source-parent.txt"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts=false > "$RUNNER_TEMP/shared-proof/install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/shared-proof/install.log"; exit 1; }
      - name: Generate documentation through the maintained command
        run: |
          pnpm docs:gen > "$RUNNER_TEMP/shared-proof/docs.log" 2>&1
          git diff --binary -- docs > "$RUNNER_TEMP/shared-proof/generated-docs.patch"
          git add -- docs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(chat-routes): generate the shared observation API'
            git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/shared-proof/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/shared-proof/tree.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/shared-proof/source.tar.gz"
      - name: Exact committed-source signoff
        run: pnpm signoff --source head --keep-going --json "$RUNNER_TEMP/shared-proof/signoff.json" > "$RUNNER_TEMP/shared-proof/signoff.log" 2>&1 || { tail -120 "$RUNNER_TEMP/shared-proof/signoff.log"; exit 1; }
      - name: Built public observer and cancellation proofs
        run: |
          node scripts/prove-chat-intelligence.mjs > "$RUNNER_TEMP/shared-proof/observer.json"
          pnpm exec vitest run tests/chat-intelligence.test.ts tests/chat-intelligence-cancellation.test.ts --reporter=json --outputFile="$RUNNER_TEMP/shared-proof/cancellation.json" > "$RUNNER_TEMP/shared-proof/cancellation.log" 2>&1
          pnpm docs:check > "$RUNNER_TEMP/shared-proof/docs-check.log" 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shared-improvement-exact-signoff
          path: ${{ runner.temp }}/shared-proof/
          retention-days: 7
