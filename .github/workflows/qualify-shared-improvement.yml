name: Qualify shared improvement source
on:
  push:
    branches: [verify/shared-agent-improvement-20261002]
permissions:
  contents: read
concurrency:
  group: qualify-shared-improvement
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: b9a6dbb228b91fa3b440932626975cb628d9f67e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen source and dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/shared-proof"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/shared-proof/commit.txt"
          pnpm install --frozen-lockfile --ignore-scripts=false > "$RUNNER_TEMP/shared-proof/install.log" 2>&1
      - name: Verify canonical documentation without a nonexistent alias
        run: |
          pnpm docs:gen > "$RUNNER_TEMP/shared-proof/docs.log" 2>&1
          git diff --exit-code
      - name: Actual public entrypoint and Runtime HTTP exporter
        shell: bash
        run: |
          cat > .qualification-collector.mjs <<'JS'
          import assert from 'node:assert/strict'
          import { createServer } from 'node:http'
          import { once } from 'node:events'
          import { createIntelligenceClient } from '@tangle-network/agent-runtime/intelligence'
          import { produceChatTurnWithIntelligence } from './dist/chat-routes/index.js'
          const spans = []
          const server = createServer((req,res) => {
            const chunks=[]
            req.on('data', c=>chunks.push(c))
            req.on('end',()=>{
              try {
                const data=JSON.parse(Buffer.concat(chunks).toString())
                for(const r of data.resourceSpans??[]) for(const s of r.scopeSpans??[]) spans.push(...s.spans??[])
                res.writeHead(200,{'content-type':'application/json'}).end('{}')
              } catch { res.writeHead(400).end() }
            })
          })
          server.listen(0,'127.0.0.1'); await once(server,'listening')
          const client=createIntelligenceClient({project:'shared-collector-proof',apiKey:'local-only',effort:'off',baseUrl:`http://127.0.0.1:${server.address().port}`})
          const checks=[]
          async function check(name,fn){await fn();checks.push(name)}
          const opts={client:()=>client,sessionId:'owned-session',workspaceId:'owned-workspace',userId:'owned-user',model:'requested-only'}
          const attrs=s=>Object.fromEntries(s.attributes.map(a=>[a.key,a.value]))
          try {
            let ran=false
            const event={type:'partial',data:{secret:'PRIVATE_NOT_EXPORTED'}}
            const normal=await produceChatTurnWithIntelligence({...opts,runId:'native-normal',produce:()=>({stream:(async function*(){ran=true;yield event})(),finalText:()=>{throw Error('must not read')}})})
            await check('construction does not execute or initialize telemetry',async()=>{assert.equal(ran,false);assert.equal(spans.length,0)})
            assert.equal((await normal.stream.next()).value,event)
            await check('partial work has no completed export',async()=>{assert.equal(client.exportStats()?.pending??0,0);assert.equal(spans.length,0)})
            await normal.stream.next();await client.flush()
            await check('one real collector receipt after exhaustion',async()=>{assert.equal(spans.length,1);assert.equal(attrs(spans[0])['tangle.stream.termination'].stringValue,'exhausted')})
            const failure=new Error('PRIVATE_FAILURE')
            const failed=await produceChatTurnWithIntelligence({...opts,runId:'native-failed',produce:()=>({stream:(async function*(){throw failure})(),finalText:()=>''})})
            await assert.rejects(failed.stream.next(),e=>e===failure);await client.flush()
            await check('original failure and separate failed observation',async()=>{assert.equal(spans.length,2);assert.equal(attrs(spans[1])['tangle.stream.termination'].stringValue,'failed')})
            const cancelled=await produceChatTurnWithIntelligence({...opts,runId:'native-cancelled',produce:()=>({stream:(async function*(){yield event;yield event})(),finalText:()=>''})})
            await cancelled.stream.next();await cancelled.stream.return();await client.flush()
            await check('cancellation is observed without claiming successful work',async()=>{assert.equal(spans.length,3);assert.equal(attrs(spans[2])['tangle.stream.termination'].stringValue,'interrupted')})
            await check('actual exporter preserves identity, unknown cost, and private payload boundaries',async()=>{
              for(const span of spans){const a=attrs(span);assert.equal(a['tangle.sessionId'].stringValue,'owned-session');assert.equal(a['tangle.workspaceId'].stringValue,'owned-workspace');assert.equal(a['tangle.outcome.success'],undefined);assert.equal(a['tangle.outcome.score'],undefined);assert.equal(a['tangle.usage.inference_usd_known'].boolValue,false)}
              assert.equal(JSON.stringify(spans).includes('PRIVATE'),false)
              assert.equal(client.exportStats().written,3);assert.equal(client.exportStats().dropped,0)
            })
            console.log(JSON.stringify({source:process.env.SOURCE_SHA,checks,passed:checks.length,spans:spans.length,scope:'Built Agent App public export, actual installed Runtime, real loopback HTTP collector. No external inference or production delivery.'},null,2))
          } finally {server.closeAllConnections();await new Promise(resolve=>server.close(resolve))}
          JS
          node .qualification-collector.mjs > "$RUNNER_TEMP/shared-proof/collector.json"
          rm .qualification-collector.mjs
          node scripts/prove-chat-intelligence.mjs > "$RUNNER_TEMP/shared-proof/observer.json"
          pnpm exec vitest run tests/chat-intelligence.test.ts tests/chat-intelligence-cancellation.test.ts --reporter=json --outputFile="$RUNNER_TEMP/shared-proof/cancellation.json" > "$RUNNER_TEMP/shared-proof/cancellation.log" 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shared-improvement-collector-proof
          path: ${{ runner.temp }}/shared-proof/
          retention-days: 7
