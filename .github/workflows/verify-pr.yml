name: Verify PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source identity
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar.gz -o verification/source.tar.gz HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Generate API documentation
        run: |
          pnpm docs:gen
          git diff -- docs > verification/generated-docs.patch
      - run: pnpm run typecheck
      - run: pnpm run test:gates
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run test:generated
      - run: pnpm run knip
      - name: Retain verification inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verification-${{ github.event.pull_request.number }}
          path: verification/
          retention-days: 7
