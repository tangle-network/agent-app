name: Verify PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record exact source
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar.gz HEAD > verification/source.tar.gz
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts=false > verification/install.log 2>&1 || { tail -60 verification/install.log; exit 1; }
      - name: Verify generated documentation
        run: |
          pnpm docs:gen > verification/docs.log 2>&1
          git diff --exit-code -- docs
      - run: pnpm run typecheck > verification/typecheck.log 2>&1 || { cat verification/typecheck.log; exit 1; }
      - run: pnpm run test:gates > verification/gates.log 2>&1 || { tail -80 verification/gates.log; exit 1; }
      - run: pnpm run build > verification/build.log 2>&1 || { tail -80 verification/build.log; exit 1; }
      - name: Test all source
        run: pnpm exec vitest run --reporter=json --outputFile=verification/tests.json > verification/tests.log 2>&1 || { tail -100 verification/tests.log; exit 1; }
      - run: pnpm run test:generated > verification/generated.log 2>&1 || { tail -100 verification/generated.log; exit 1; }
      - run: pnpm run knip > verification/knip.log 2>&1 || { cat verification/knip.log; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-verification-${{ github.event.pull_request.number }}
          path: verification/
          retention-days: 7
