name: Fleet UI owner final qualification
on:
  push:
    branches: [verify/fleet-ui-parity-20261003]
    paths: [.github/workflows/fleet-ui-owner-final.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-workspace-ui-parity-20261003
          fetch-depth: 0
      - name: Correct explicit fixture array bounds
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1febde691163429889eb1dd08d5e2e4bddf4b047
          python - <<'PY'
          from pathlib import Path
          p=Path('src/web-react/workspace-controls.test.tsx')
          t=p.read_text().replace('models[0]', 'models[0]!').replace('items[1]', 'items[1]!')
          p.write_text(t)
          p=Path('src/stories/workspace/WorkspaceControls.stories.tsx')
          t=p.read_text().replace('catalogModels[0].id', 'catalogModels[0]!.id')
          t=t.replace('className="w-full rounded-lg p-2 text-left text-sm">New workspace', 'onClick={() => setResult("Local fixture: create workspace requested")} className="w-full rounded-lg p-2 text-left text-sm">New workspace')
          p.write_text(t)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/web-react/workspace-controls.test.tsx src/stories/workspace/WorkspaceControls.stories.tsx
          git commit -m "test(workspace): make fixture bounds explicit under strict indexing"
          git push origin HEAD:refs/heads/feat/shared-workspace-ui-parity-20261003
          mkdir -p "$RUNNER_TEMP/ui-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/ui-proof/source-head.txt"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install and focused checks
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts=false 2>&1 | tee "$RUNNER_TEMP/ui-proof/install.log"
          pnpm exec vitest run src/web-react/workspace-controls.test.tsx src/web-react/entry-composer.test.tsx src/web-react/agent-session-controls.test.tsx tests/web-react/popover-escapes-host.test.tsx tests/web-react/popover-canon-source.test.ts tests/web-react/model-picker-state.test.tsx tests/browser-safe-subpaths.test.ts 2>&1 | tee "$RUNNER_TEMP/ui-proof/focused.log"
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/ui-proof/typecheck.log"
      - name: Generate API documentation
        run: |
          set -euo pipefail
          pnpm docs:gen 2>&1 | tee "$RUNNER_TEMP/ui-proof/docs.log"
          if ! git diff --quiet -- docs; then
            git add docs
            git commit -m "docs(api): generate shared workspace UI contracts"
            git push origin HEAD:refs/heads/feat/shared-workspace-ui-parity-20261003
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/ui-proof/source-head.txt"
      - name: Exact source signoff
        run: pnpm signoff --source head --keep-going --json "$RUNNER_TEMP/ui-proof/signoff.json" 2>&1 | tee "$RUNNER_TEMP/ui-proof/signoff.log"
      - name: Build interaction catalog
        if: always()
        run: pnpm build-storybook --quiet 2>&1 | tee "$RUNNER_TEMP/ui-proof/storybook.log"
      - name: Chromium interaction and viewport proof
        if: always()
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          python -m http.server 6010 --directory storybook-static > "$RUNNER_TEMP/ui-proof/server.log" 2>&1 &
          cat > .ui-browser-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';
          const root=process.env.RUNNER_TEMP+'/ui-proof';
          await mkdir(root+'/screens',{recursive:true});
          const browser=await chromium.launch();
          const checks=[];
          try {
            for (const size of [{name:'desktop',width:1440,height:900},{name:'phone',width:390,height:720},{name:'short',width:568,height:320}]) {
              const page=await browser.newPage({viewport:{width:size.width,height:size.height}});
              const errors=[]; page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:6010/iframe.html?id=workspace-shared-controls--research&viewMode=story');
              await page.getByRole('button',{name:'Agent settings',exact:true}).first().waitFor();
              for (const theme of ['light','dark']) {
                await page.evaluate(t=>{document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.style.colorScheme=t;},theme);
                await page.screenshot({path:`${root}/screens/${size.name}-${theme}.png`,fullPage:true});
                const trigger=page.getByRole('button',{name:'Agent settings',exact:true}).first();
                await trigger.click();
                const dialog=page.getByRole('dialog',{name:'Agent settings',exact:true});
                await dialog.waitFor();
                const bounds=await dialog.boundingBox();
                if(!bounds || bounds.x < -1 || bounds.x+bounds.width > size.width+1 || bounds.y < -1 || bounds.y+bounds.height > size.height+1) throw Error('Settings outside viewport '+size.name+JSON.stringify(bounds));
                await page.screenshot({path:`${root}/screens/${size.name}-${theme}-settings.png`,fullPage:true});
                await page.keyboard.press('Escape');
                if(await dialog.count()) throw Error('Escape did not close settings');
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+1);
                if(overflow) throw Error('Horizontal overflow '+size.name);
                checks.push(`${size.name}/${theme}: settings placement, Escape, no horizontal overflow`);
              }
              const switcher=page.getByRole('button',{name:/Switch workspace:/}).filter({visible:true}).first();
              await switcher.click();
              const search=page.getByRole('textbox',{name:'Search workspaces'});
              await search.fill('not-found');
              await page.getByRole('status').filter({hasText:'No matches'}).waitFor();
              await page.keyboard.press('Escape');
              checks.push(size.name+': searchable workspace and dismissal');
              if(errors.length) throw Error(errors.join('\n'));
              await page.close();
            }
            await writeFile(root+'/browser.json',JSON.stringify({ok:true,checks},null,2));
          } catch(error) {
            await writeFile(root+'/browser.json',JSON.stringify({ok:false,checks,error:String(error)},null,2));
            throw error;
          } finally {await browser.close();}
          JS
          node .ui-browser-proof.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fleet-ui-owner-final-proof
          path: ${{ runner.temp }}/ui-proof
          retention-days: 5
          if-no-files-found: error
