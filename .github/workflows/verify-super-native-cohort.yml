name: Verify SUPER native cohort
on:
  push:
    branches: [verify/super-native-cohort-20260930]
    paths: [.github/workflows/verify-super-native-cohort.yml]
permissions:
  contents: read
jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - name: Resolve and install published compatible packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/super-cohort /tmp/cohort-solver /tmp/cohort-evidence
          npm install --prefix /tmp/cohort-solver --ignore-scripts --no-audit --no-fund semver@7
          cd /tmp/super-cohort
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          import {createRequire} from 'node:module';
          const require=createRequire('/tmp/cohort-solver/package.json'), semver=require('semver');
          const view=(spec,field)=>JSON.parse(execFileSync('npm',['view',spec,field,'--json'],{encoding:'utf8'}));
          const appVersion='0.50.10', peers=view('@tangle-network/agent-app@'+appVersion,'peerDependencies');
          const names=['agent-eval','agent-interface','agent-runtime','agent-integrations','hub-sdk','sandbox'];
          const pins={'@tangle-network/agent-app':appVersion};
          for(const short of names){const name='@tangle-network/'+short;
            const range=short==='sandbox'?'>=0.58.1 <0.59.0':peers[name];
            const versions=view(name,'versions').filter(v=>!semver.prerelease(v)&&semver.satisfies(v,range));
            const version=semver.rsort(versions)[0];if(!version)throw Error('No compatible published version for '+name);
            pins[name]=version;
          }
          const manifest={name:'super-agent',version:'9.0.0',private:true,type:'module',engines:{node:'>=22.16.0'},
            dependencies:{...pins,marked:'18.0.14'},devDependencies:{'@types/node':'26.6.2',typescript:'7.0.2'},
            overrides:{'@tangle-network/agent-integrations':{'csv-parse':'7.0.2'}}};
          writeFileSync('package.json',JSON.stringify(manifest,null,2)+'\n');
          writeFileSync('/tmp/cohort-evidence/resolved.json',JSON.stringify({appVersion,peers,pins},null,2)+'\n');
          JS
          npm install --ignore-scripts --no-audit --no-fund > /tmp/cohort-evidence/install.log 2>&1
          npm ls --all --json > /tmp/cohort-evidence/npm-ls.json
          node --input-type=module - <<'JS' > /tmp/cohort-evidence/imports.json
          const modules={
            application:await import('@tangle-network/agent-app/hosted-agent/application'),
            lines:await import('@tangle-network/sandbox/core'),
            runtime:await import('@tangle-network/agent-runtime/tool-loop'),
            integrations:await import('@tangle-network/agent-integrations/conversation-events'),
            eval:await import('@tangle-network/agent-eval/multishot'),
            interactions:await import('@tangle-network/agent-interface/interaction'),
          };
          if(typeof modules.application.createApplicationLineHandler!=='function'||typeof modules.application.attachWorkspaceLine!=='function'||typeof modules.lines.parseLineApplicationRequest!=='function')throw Error('Missing native application exports');
          console.log(JSON.stringify(Object.fromEntries(Object.entries(modules).map(([key,value])=>[key,Object.keys(value)])),null,2));
          JS
          cp package.json package-lock.json /tmp/cohort-evidence/
          tar -czf /tmp/cohort-evidence/installed-cohort.tar.gz node_modules package.json package-lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: super-native-cohort
          path: /tmp/cohort-evidence/
          retention-days: 3
