name: Tangle agent v1 package build
on:
  push:
    branches: [pro/tangle-agent-v1-20260925]
    paths: [.github/workflows/tangle-agent-v1-build.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pro/tangle-agent-v1-20260925
      - name: Wire verified package dependencies and runtime credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tangle-agent-build"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('package.json'); package=json.loads(p.read_text())
          for name in ['index','home']:
            subpath='./general-agent'+('/home' if name=='home' else '')
            package['exports'][subpath]={'types':f'./dist/general-agent/{name}.d.ts','import':f'./dist/general-agent/{name}.js'}
          deps=package.setdefault('dependencies',{})
          deps.update({'@modelcontextprotocol/sdk':'1.30.0','@tangle-network/tcloud':'0.5.2','@tangle-network/browser-agent-driver':'0.36.1','@tangle-network/hub-sdk':'0.19.1'})
          for name, constraint in {'playwright':'^1.40.0','@ai-sdk/google':'^3.0.33','@ai-sdk/anthropic':'^3.0.49','@anthropic-ai/sdk':'>=0.93.0 <1'}.items():
            versions=json.loads(subprocess.check_output(['npm','view',name+'@'+constraint,'version','--json'],text=True))
            deps[name]=versions[-1] if isinstance(versions,list) else versions
          # Existing runtime peer supports 0.53.0. Line attach forwards additive
          # rolePolicy fields, whose authoritative validation is in the platform.
          package['devDependencies']['@tangle-network/sandbox']='0.53.0'
          p.write_text(json.dumps(package,indent=2)+'\n')
          p=Path('tsup.config.ts'); s=p.read_text(); marker="    'hosted-agent/index': 'src/hosted-agent/index.ts',"; assert marker in s
          if "'general-agent/index'" not in s:
            s=s.replace(marker,marker+"\n    'general-agent/index': 'src/general-agent/index.ts',\n    'general-agent/home': 'src/general-agent/home.ts',\n    'general-agent/server': 'src/general-agent/server.ts',",1)
          p.write_text(s)
          p=Path('docker/general-agent.Dockerfile'); s=p.read_text().replace('USER root','USER root\nENV PLAYWRIGHT_BROWSERS_PATH=/opt/tangle-browsers',1).replace('chmod -R a+rX /opt/tangle-agent','chmod -R a+rX /opt/tangle-agent /opt/tangle-browsers'); p.write_text(s)
          p=Path('src/general-agent/server.ts'); s=p.read_text().replace('import { HubClient }','import { HubClient, resolveHubAuth }').replace('import { mkdir, writeFile }','import { mkdir, writeFile, readFile }')
          old="const apiKey = process.env.TANGLE_API_KEY\nif (!apiKey) throw new Error('Missing sandbox-scoped TANGLE_API_KEY; do not substitute an owner root key')"
          new="const apiKey = process.env.OPENAI_API_KEY\nif (!apiKey) throw new Error('Missing sandbox Router proxy credential; refusing owner-key fallback')\nconst credentialFile = process.env.TANGLE_API_KEY_FILE\nif (!credentialFile) throw new Error('Missing refreshable sandbox Hub credential file')"
          assert old in s; s=s.replace(old,new,1)
          old="const hub = new HubClient({ apiKey, baseUrl: 'https://id.tangle.tools' })"
          new="const hub = new HubClient({ baseUrl: 'https://id.tangle.tools', authHeaders: async () => ({\n  Authorization: 'Bearer ' + resolveHubAuth({ TANGLE_API_KEY: (await readFile(credentialFile, 'utf8')).trim() }),\n}) })"
          assert old in s; s=s.replace(old,new,1); p.write_text(s)
          p=Path('src/general-agent/index.ts'); s=p.read_text().replace("key: 'TANGLE_API_KEY', format: 'bearer'", "key: 'OPENAI_API_KEY', format: 'bearer'")
          s=s.replace("env: { TANGLE_BROWSER_PROXY:", "env: { OPENAI_API_KEY: { kind: 'secret-ref', key: 'OPENAI_API_KEY' },\n          TANGLE_API_KEY_FILE: { kind: 'secret-ref', key: 'TANGLE_API_KEY_FILE' },\n          TANGLE_BROWSER_PROXY:")
          s += "\nexport { configureAgentHeartbeat, agentHeartbeatDefinition, type AgentHeartbeatConfig } from './heartbeat'\n"
          p.write_text(s)
          PY
          npm install --global pnpm@10.23.0
          pnpm install --lockfile-only --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/tangle-agent-build/lock.log"
          git add package.json pnpm-lock.yaml tsup.config.ts src/general-agent docker/general-agent.Dockerfile
          git config user.name tangletools
          git config user.email hello@tangle.tools
          git commit -m 'build: publish general agent with verified peers and managed credentials'
          git push origin HEAD:refs/heads/pro/tangle-agent-v1-20260925
          git rev-parse HEAD > "$RUNNER_TEMP/tangle-agent-build/REVISION"
      - name: Frozen install and package build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/tangle-agent-build/install.log"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/tangle-agent-build/build.log"
          pnpm pack --pack-destination "$RUNNER_TEMP/tangle-agent-build"
      - name: Export exact source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tangle-agent-build"
          git archive --format=tar HEAD src/general-agent package.json tsup.config.ts docker/general-agent.Dockerfile > "$RUNNER_TEMP/tangle-agent-build/source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tangle-agent-v1-package-build
          path: ${{ runner.temp }}/tangle-agent-build/
          retention-days: 3
