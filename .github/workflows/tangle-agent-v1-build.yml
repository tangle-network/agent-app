name: Tangle agent v1 build
on:
  push:
    branches: [feat/default-agent-home]
    paths: [.github/workflows/tangle-agent-v1-build.yml]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/feat/default-agent-home'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Complete the existing package surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/hosted-agent/index.ts')
          s = p.read_text()
          exports = "\nexport { buildGeneralAgentProfile, createTangleAgent, GENERAL_AGENT_MODEL, GENERAL_AGENT_SYSTEM_PROMPT } from './general'\nexport type { GeneralAgentProfileOptions, GeneralAgentMember, TangleAgentOptions } from './general'\nexport { agentHomeWorkflows } from './workflows'\nexport type { AgentHomeWorkflowOptions, AgentHomeWorkflow } from './workflows'\n"
          if "from './general'" not in s: p.write_text(s + exports)
          p = Path('src/profile/home.ts')
          s = p.read_text()
          if "from './home-maintenance'" not in s:
            s = "import { HOME_MAINTENANCE } from './home-maintenance'\n" + s
            s = s.replace("    inline('BOOTSTRAP.md', BOOTSTRAP),", "    inline('BOOTSTRAP.md', BOOTSTRAP),\n    inline('.tangle/home.py', HOME_MAINTENANCE),")
            s = s.replace('export const DEFAULT_HOME_LIMITS', '/** Unicode code-point budgets. The home command also bounds UTF-8 bytes. */\nexport const DEFAULT_HOME_LIMITS')
            s = s.replace("  const owned = new Set", "  for (const file of profile.resources?.files ?? []) {\n    if (file.path === 'AGENTS.md' && (file.resource.kind !== 'inline' || file.resource.content !== AGENTS)) {\n      throw new Error('AGENTS.md is platform-owned; put business rules in skills and preset instructions')\n    }\n  }\n  const owned = new Set")
            s = s.replace("  return merged\n}", "  merged.prompt = { ...merged.prompt, instructions: [...(merged.prompt?.instructions ?? []),\n    'Read the home files. Use python3 .tangle/home.py for bounded home reads, writes, bootstrap and consolidation. It consumes JSON on stdin. Never stage the entire sandbox with git add .',\n  ] }\n  return merged\n}")
            s = s.replace('An app file\n * at the same path replaces the platform file.', 'An app may seed its own mutable files. AGENTS.md stays platform-owned.')
            p.write_text(s)
          p = Path('src/profile/home-maintenance.ts')
          s = p.read_text()
          start = s.index('    # This separate index')
          end = s.index("    changes = git", start)
          s = s[:start] + "    # Stage only individually validated home paths, including tracked deletions.\n    tracked = list(filter(None, git('ls-files', '-z').split('\\0')))\n    staged = sorted(set(existing + tracked))\n    for path in staged:\n        checked(path)\n    if staged:\n        git('add', '--all', '--', *staged)\n" + s[end:]
          start = s.index('    heads = subprocess.run')
          end = s.index("\n\ndef main", start)
          s = s[:start] + "    try:\n        head = git('rev-parse', '--verify', 'HEAD')\n    except RuntimeError:\n        head = None\n    return {'commit': head, 'changed': bool(changes), 'paths': existing}\n" + s[end:]
          s = s.replace('import contextlib\n', '')
          p.write_text(s)
          Path('.github/workflows/tangle-agent-v1-package.yml').unlink(missing_ok=True)
          # The one-time integration step removes its own write permission. The
          # retained workflow only builds source and never rewrites a branch.
          Path('.github/workflows/tangle-agent-v1-build.yml').write_text('''name: Tangle agent v1 build
          on:
            workflow_dispatch:
            pull_request:
              paths: [src/hosted-agent/**, src/profile/home*, .github/workflows/tangle-agent-v1-build.yml]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with: {persist-credentials: false}
                - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
                - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
                  with: {node-version-file: .nvmrc, cache: pnpm}
                - run: pnpm install --frozen-lockfile
                - run: pnpm typecheck
                - run: pnpm build
          ''')
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version-file: .nvmrc, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:gen
      - run: pnpm typecheck
      - run: pnpm build
      - name: Exercise the home command on a real filesystem
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          source = pathlib.Path('src/profile/home-maintenance.ts').read_text().split('String.raw`', 1)[1].rsplit('`', 1)[0]
          root = pathlib.Path(tempfile.mkdtemp(prefix='tangle-home-'))
          (root / '.tangle').mkdir()
          (root / '.tangle/home.py').write_text(source)
          for path in ['AGENTS.md', 'SOUL.md', 'IDENTITY.md', 'USER.md', 'MEMORY.md', 'BOOTSTRAP.md']:
            (root / path).write_text('')
          def call(action, data=None, ok=True):
            p = subprocess.run(['python3', str(root / '.tangle/home.py'), action], input=json.dumps(data) if data is not None else '', text=True, capture_output=True)
            assert (p.returncode == 0) == ok, (action, p.returncode, p.stderr)
            return json.loads(p.stdout) if p.returncode == 0 else None
          call('status')
          call('write', {'path':'USER.md','content':'🦋' * 4000})
          call('write', {'path':'USER.md','content':'x' * 4001}, False)
          call('write', {'path':'AGENTS.md','content':'changed'}, False)
          call('write', {'path':'../outside','content':'changed'}, False)
          (root / 'memory/not-a-note.secret').write_text('must not be tracked')
          receipt = call('commit')
          tracked = subprocess.check_output(['git', '--git-dir=' + str(root / '.tangle/home.git'), 'ls-tree', '-r', '--name-only', 'HEAD'], text=True)
          assert 'secret' not in tracked and '.tangle' not in tracked
          call('write', {'path':'IDENTITY.md','content':'Tangle agent'})
          call('bootstrap')
          assert not (root / 'BOOTSTRAP.md').exists()
          call('consolidate', {'user':'2026-09-26: Prefers English.', 'memory':'Durable fact.'})
          (root / 'USER.md').unlink()
          (root / 'USER.md').symlink_to(root / 'SOUL.md')
          call('read', {'path':'USER.md'}, False)
          print(json.dumps({'homeCommand':'passed', 'initialCommit':receipt['commit'], 'networkCalls':0}))
          PY
      - name: Inspect the published media client
        run: |
          mkdir -p "$RUNNER_TEMP/tcloud-proof"
          npm install --prefix "$RUNNER_TEMP/tcloud-proof" --ignore-scripts @tangle-network/tcloud@0.5.2
          "$RUNNER_TEMP/tcloud-proof/node_modules/.bin/tcloud" --help
          node --input-type=module -e "const {TCloud}=await import('file://'+process.env.RUNNER_TEMP+'/tcloud-proof/node_modules/@tangle-network/tcloud/dist/index.js'); for (const n of ['imageGenerate','videoGenerate','speech','models']) { if(typeof TCloud.prototype[n]!=='function') throw Error('missing '+n); } console.log('published media client methods present')"
      - name: Commit the verified package, not a source handoff
        run: |
          git config user.name 'Tangle Agent'
          git config user.email 'agent@users.noreply.github.com'
          git add src/hosted-agent/index.ts src/profile/home.ts src/profile/home-maintenance.ts docs .github/workflows
          git commit -m 'feat: finish general-agent exports and verify bounded git home'
          git push origin HEAD:feat/default-agent-home
          git rev-parse HEAD
