name: OIDC caller package check

on:
  push:
    branches: [gtr/oidc-caller-build-20260926]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e8854f80b97e55b4a1fa07d7efe30afb0b829961
          persist-credentials: false
          path: caller
      - name: Archive caller source for review
        run: |
          mkdir -p "$RUNNER_TEMP/oidc-source"
          git -C caller archive HEAD -o "$RUNNER_TEMP/oidc-source/agent-app.tar"
          git -C caller rev-parse HEAD > "$RUNNER_TEMP/oidc-source/agent-app.commit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oidc-caller-source
          path: ${{ runner.temp }}/oidc-source
          retention-days: 3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tangle-network/agent-runtime
          ref: 68532c2c76e6dea3c3d66c5977a9c269fef5b3f5
          persist-credentials: false
          path: runtime
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: runtime/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Build exact merged runtime
        working-directory: runtime
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          mkdir -p "$RUNNER_TEMP/oidc-runtime"
          pnpm pack --pack-destination "$RUNNER_TEMP/oidc-runtime"
          git rev-parse HEAD > "$RUNNER_TEMP/oidc-runtime/SOURCE_COMMIT"
          sha256sum "$RUNNER_TEMP/oidc-runtime/"*.tgz > "$RUNNER_TEMP/oidc-runtime/SHA256SUMS"
          node --input-type=module -e 'const p=await import("./dist/platform.js"); console.log(JSON.stringify({PlatformOidcClient:typeof p.PlatformOidcClient,createPkcePair:typeof p.createPkcePair})); if(typeof p.PlatformOidcClient!=="function" || typeof p.createPkcePair!=="function") process.exit(1)'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oidc-runtime-build
          path: ${{ runner.temp }}/oidc-runtime
          retention-days: 3
