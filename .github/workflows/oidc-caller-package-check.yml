name: OIDC caller install and build
on:
  push:
    branches: [gtr/oidc-caller-build-20260926]
permissions:
  contents: write
concurrency:
  group: oidc-caller-build
  cancel-in-progress: true
jobs:
  caller:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply caller-only edits to the pinned base
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oidc-proof"
          git worktree add --detach "$RUNNER_TEMP/caller" e8854f80b97e55b4a1fa07d7efe30afb0b829961
          python3 .gtr/app-edit.py "$RUNNER_TEMP/caller"
          cd "$RUNNER_TEMP/caller"
          npm view @tangle-network/agent-knowledge@17.1.8 version peerDependencies --json | tee "$RUNNER_TEMP/oidc-proof/knowledge-peer.json"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.devDependencies["@tangle-network/agent-knowledge"]="17.1.8"; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'
          git diff --check
      - name: Install and verify the generated lockfile
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/caller"
          pnpm install --no-frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/oidc-proof/install.log"
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/oidc-proof/frozen-install.log"
      - name: Commit only source, proof instructions and generated lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/caller"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/platform/sso.ts src/app-auth/index.ts src/peer-floors/check.test.ts package.json pnpm-lock.yaml scripts/oidc-live-proof.mjs docs/OIDC-CALLER-GTR.md
          git diff --cached --check
          git commit -m 'feat(auth): use registered OIDC clients with PKCE and token persistence'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/oidc-caller-migration
          git rev-parse HEAD | tee "$RUNNER_TEMP/oidc-proof/commit.txt"
          git archive HEAD -o "$RUNNER_TEMP/oidc-proof/agent-app-source.tar"
      - name: Build the real package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/caller"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/oidc-proof/build.log"
          node --check scripts/oidc-live-proof.mjs
          node --input-type=module -e 'const app=await import("./dist/platform/index.js"); const rt=await import("@tangle-network/agent-runtime/platform"); if(typeof app.createTangleSsoHandlers!=="function" || typeof rt.PlatformOidcClient!=="function") throw new Error("Missing caller exports"); console.log(JSON.stringify({caller:typeof app.createTangleSsoHandlers,oidc:typeof rt.PlatformOidcClient}));'
          pnpm pack --pack-destination "$RUNNER_TEMP/oidc-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oidc-caller-build-evidence
          path: ${{ runner.temp }}/oidc-proof
          retention-days: 7
