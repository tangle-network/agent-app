name: Published packages proof
on:
  push:
    branches: [codex/published-packages-sweep-1-20260926]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-packages-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.24.0
      - name: Record exact source
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          node --version > evidence/node.txt
          pnpm --version > evidence/pnpm.txt
      - name: Install locked dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Build published package
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/build.log
          node --check scripts/prove-published-hub.mjs
      - name: Install packed candidate in a real consumer
        run: |
          set -euo pipefail
          repo="$PWD"
          mkdir -p "$RUNNER_TEMP/app-package" "$RUNNER_TEMP/app-consumer"
          pnpm pack --pack-destination "$RUNNER_TEMP/app-package" > evidence/pack.log
          package_file=$(node -p "process.env.RUNNER_TEMP + '/app-package/tangle-network-agent-app-' + require('./package.json').version + '.tgz'")
          test -f "$package_file"
          sha256sum "$package_file" > evidence/package-sha256.txt
          printf '{"name":"gtr-app-consumer","private":true,"type":"module"}\n' > "$RUNNER_TEMP/app-consumer/package.json"
          # Match the repository's existing explicit refusal of optional SSH native builds.
          # Do not turn off peer validation or silently permit dependency scripts.
          printf 'allowBuilds:\n  cpu-features: false\n  ssh2: false\n' > "$RUNNER_TEMP/app-consumer/pnpm-workspace.yaml"
          cp scripts/prove-published-hub.mjs "$RUNNER_TEMP/app-consumer/"
          cd "$RUNNER_TEMP/app-consumer"
          pnpm add "$package_file" @tangle-network/hub-sdk@0.19.2 @tangle-network/agent-integrations@0.55.0 2>&1 | tee "$repo/evidence/consumer-install.log"
          node --input-type=module - <<'JS' | tee "$repo/evidence/consumer-import.log"
          import { invokeIntegrationHub } from '@tangle-network/agent-app/integrations';
          import { integrationToolName } from '@tangle-network/agent-integrations/catalog';
          import { HubClient } from '@tangle-network/hub-sdk';
          if ([invokeIntegrationHub, integrationToolName, HubClient].some(value => typeof value !== 'function')) {
            throw new Error('A required published entrypoint is unavailable');
          }
          console.log(JSON.stringify({ installedEntrypoints: true, liveRequestRun: false }));
          JS
          cp pnpm-lock.yaml "$repo/evidence/consumer-lock.yaml"
          cp pnpm-workspace.yaml "$repo/evidence/consumer-build-policy.yaml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-packages-proof
          path: evidence/
          retention-days: 7
