name: Published packages proof
on:
  push:
    branches: [codex/published-packages-sweep-1-20260926]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-packages-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.24.0
      - name: Record exact source
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          node --version > evidence/node.txt
          pnpm --version > evidence/pnpm.txt
      - name: Install locked dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Build published package
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/build.log
          node --check scripts/prove-published-hub.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-packages-proof
          path: evidence/
          retention-days: 7
