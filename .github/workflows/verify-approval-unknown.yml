name: Verify uncertain approval exact head

on:
  push:
    branches: [verify/hub-approval-unknown-f8b284c4]

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f8b284c4227982f03ed584191f74c6e19543a41d
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate identity
        run: test "$(git rev-parse HEAD)" = f8b284c4227982f03ed584191f74c6e19543a41d
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Run unchanged full exact-head signoff
        shell: bash
        run: |
          set -euo pipefail
          pnpm signoff --source head --keep-going \
            --cache-dir "$RUNNER_TEMP/signoff-cache" \
            --json "$RUNNER_TEMP/signoff-f8b284c4.json" \
            2>&1 | tee "$RUNNER_TEMP/signoff-f8b284c4.log"
      - name: Verify proof subject
        if: always()
        env:
          PROOF: ${{ runner.temp }}/signoff-f8b284c4.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync(process.env.PROOF, 'utf8'));
          if (proof.repo.head !== 'f8b284c4227982f03ed584191f74c6e19543a41d') throw new Error('Wrong proof subject');
          console.log(JSON.stringify({ head: proof.repo.head, ok: proof.ok, steps: proof.steps.map(({name, status}) => ({name, status})) }, null, 2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hub-approval-signoff-f8b284c4
          path: |
            ${{ runner.temp }}/signoff-f8b284c4.json
            ${{ runner.temp }}/signoff-f8b284c4.log
          if-no-files-found: error
          retention-days: 14
