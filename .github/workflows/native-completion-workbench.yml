name: Native completion workbench
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'tangle-network/agent-app' && github.head_ref == 'fix/native-completion-projection'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Retain tracked source and installed package toolchain
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/app-source.tar.gz"
          tar -czf "$RUNNER_TEMP/app-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-completion-toolchain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-revision.txt
            ${{ runner.temp }}/app-source.tar.gz
            ${{ runner.temp }}/app-dependencies.tar.gz
          retention-days: 1
