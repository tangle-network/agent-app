name: Native completion workbench
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'tangle-network/agent-app' && github.head_ref == 'fix/native-completion-projection'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture exact package source
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/agent-app-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-completion-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-app-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
