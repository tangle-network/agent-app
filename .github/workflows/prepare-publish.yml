name: Qualify Agent App publication

on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        default: ''
      source_artifact_id:
        type: string
        default: ''
      source_artifact_digest:
        type: string
        default: ''
      source_sha:
        type: string
        default: ''
    outputs:
      mode:
        value: ${{ jobs.package_release.outputs.mode }}
      version:
        value: ${{ jobs.package_release.outputs.version }}
      base-sha:
        value: ${{ jobs.package_release.outputs.base-sha }}
      publish-control-sha:
        value: ${{ jobs.package_release.outputs.publish-control-sha }}
      release-control-sha:
        value: ${{ jobs.package_release.outputs.release-control-sha }}
      artifact-id:
        value: ${{ jobs.package_release.outputs.artifact-id }}
      artifact-run-id:
        value: ${{ jobs.package_release.outputs.artifact-run-id }}
      artifact-digest:
        value: ${{ jobs.package_release.outputs.artifact-digest }}
      agent-app-pending:
        value: ${{ jobs.package_release.outputs.agent-app-pending }}
      create-agent-app-pending:
        value: ${{ jobs.package_release.outputs.create-agent-app-pending }}

permissions:
  contents: read
  actions: read

jobs:
  package_release:
    if: >-
      github.repository == 'tangle-network/agent-app' && (
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        github.event_name == 'push' && github.ref == 'refs/heads/main'
      )
      )
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    permissions:
      actions: read
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      base-sha: ${{ steps.release.outputs.base-sha }}
      publish-control-sha: ${{ steps.control.outputs.publish-sha }}
      release-control-sha: ${{ steps.control.outputs.release-sha }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-run-id: ${{ steps.artifact.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
      agent-app-pending: ${{ steps.publication.outputs.agent-app-pending }}
      create-agent-app-pending: ${{ steps.publication.outputs.create-agent-app-pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a merged release source before running package code
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Stage release controls
        id: control
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish-bundle"
          cp .github/scripts/publish-packages.sh "$RUNNER_TEMP/publish-bundle/publish-packages.sh"
          cp .github/scripts/read-npm-pack-filename.mjs "$RUNNER_TEMP/publish-bundle/read-npm-pack-filename.mjs"
          {
            echo "publish-sha=$(sha256sum "$RUNNER_TEMP/publish-bundle/publish-packages.sh" | cut -d' ' -f1)"
            echo "pack-sha=$(sha256sum "$RUNNER_TEMP/publish-bundle/read-npm-pack-filename.mjs" | cut -d' ' -f1)"
            echo "release-sha=$(sha256sum .github/scripts/write-release.sh | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Lock release identity
        id: release
        run: |
          set -euo pipefail
          ROOT_VERSION=$(node -p "require('./package.json').version")
          CREATE_VERSION=$(node -p "require('./create-agent-app/package.json').version")
          [[ "$ROOT_VERSION" == "$CREATE_VERSION" ]] || {
            echo "::error::Package version mismatch: agent-app=$ROOT_VERSION create-agent-app=$CREATE_VERSION."
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == refs/tags/v* ]] || {
              echo '::error::Manual publication requires a release tag.'
              exit 1
            }
            MODE='tag'
            VERSION=$ROOT_VERSION
            RELEASE_SHA=$(git rev-parse HEAD)
            BASE_SHA=$(git rev-parse "$RELEASE_SHA^")
            [[ "${GITHUB_REF#refs/tags/v}" == "$VERSION" ]] || {
              echo "::error::Tag/version mismatch: tag=${GITHUB_REF#refs/tags/v} package=$VERSION."
              exit 1
            }
          else
            BASE_SHA=$GITHUB_SHA
            PLAN=$(node .github/scripts/next-release-version.mjs package.json "$BASE_SHA" --json)
            VERSION=$(node -p 'JSON.parse(process.argv[1]).version' "$PLAN")
            MODE='skip'
            if [[ $(node -p 'JSON.parse(process.argv[1]).pending' "$PLAN") == 'true' ]]; then
              MODE='auto'
            else
              echo '::notice::No pending release work since the last release; no artifact or tag will be written.'
            fi
          fi

          {
            echo "mode=$MODE"
            echo "version=$VERSION"
            echo "base-sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag is on main
        if: steps.release.outputs.mode == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA" || {
            echo "::error::Tag $TAG_SHA is not on main at $MAIN_SHA."
            exit 1
          }

      - name: Validate exact release commit
        if: steps.release.outputs.mode == 'tag'
        env:
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          BASE_SHA="$BASE_SHA" VERSION="$VERSION" RELEASE_SHA="$RELEASE_SHA" \
            bash .github/scripts/write-release.sh validate

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.release.outputs.mode != 'skip'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.release.outputs.mode != 'skip'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check release contract
        if: steps.release.outputs.mode != 'skip'
        run: |
          node .github/scripts/test-publish-workflow.mjs
          bash .github/scripts/test-publish-packages.sh
          bash .github/scripts/test-write-release.sh

      - name: Install dependencies
        if: steps.release.outputs.mode == 'auto'
        run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Prepare release manifests
        if: steps.release.outputs.mode == 'auto'
        env:
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/scripts/write-release.sh prepare
      - name: Build release
        if: steps.release.outputs.mode == 'auto'
        run: pnpm run build
      - name: Configure exact artifact pack runtime
        if: steps.release.outputs.mode == 'auto'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify artifact pack npm
        if: steps.release.outputs.mode == 'auto'
        run: "[[ $(npm --version) == '11.16.0' ]]"

      - name: Pack and inspect exact tarballs
        if: steps.release.outputs.mode == 'auto'
        env:
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          PACK_CONTROL_SHA: ${{ steps.control.outputs.pack-sha }}
          PUBLISH_CONTROL_SHA: ${{ steps.control.outputs.publish-sha }}
          RELEASE_CONTROL_SHA: ${{ steps.control.outputs.release-sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/publish-bundle"
          rm -f "$BUNDLE"/*.tgz "$BUNDLE/SHA256SUMS" "$BUNDLE/RELEASE_PROVENANCE"
          [[ $(sha256sum "$BUNDLE/read-npm-pack-filename.mjs" | cut -d' ' -f1) == "$PACK_CONTROL_SHA" ]]

          pack() {
            local source=$1 output=$2 packed
            packed=$(npm pack "$source" --ignore-scripts --pack-destination "$BUNDLE" --json |
              node "$BUNDLE/read-npm-pack-filename.mjs")
            [[ -f "$BUNDLE/$packed" ]] || {
              echo "::error::npm pack did not create $packed."
              exit 1
            }
            mv "$BUNDLE/$packed" "$BUNDLE/$output"
          }
          pack . agent-app.tgz
          pack ./create-agent-app create-agent-app.tgz

          EXPECTED_VERSION="$RELEASE_VERSION" \
            bash "$BUNDLE/publish-packages.sh" validate \
            "$BUNDLE/agent-app.tgz" "$BUNDLE/create-agent-app.tgz"
          npm publish "$BUNDLE/agent-app.tgz" --dry-run --ignore-scripts --access public >/dev/null
          npm publish "$BUNDLE/create-agent-app.tgz" --dry-run --ignore-scripts --access public >/dev/null
          printf '%s\n' \
            'format=1' \
            "base_sha=$BASE_SHA" \
            "version=$RELEASE_VERSION" \
            "source_run_id=$GITHUB_RUN_ID" \
            "publish_control_sha=$PUBLISH_CONTROL_SHA" \
            "release_control_sha=$RELEASE_CONTROL_SHA" > "$BUNDLE/RELEASE_PROVENANCE"
          (
            cd "$BUNDLE"
            sha256sum agent-app.tgz create-agent-app.tgz publish-packages.sh RELEASE_PROVENANCE > SHA256SUMS
          )

      - name: Upload release artifact
        if: steps.release.outputs.mode == 'auto'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publish-bundle/agent-app.tgz
            ${{ runner.temp }}/publish-bundle/create-agent-app.tgz
            ${{ runner.temp }}/publish-bundle/publish-packages.sh
            ${{ runner.temp }}/publish-bundle/RELEASE_PROVENANCE
            ${{ runner.temp }}/publish-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Resolve source artifact
        if: steps.release.outputs.mode != 'skip'
        id: artifact
        env:
          INPUT_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
          INPUT_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          UPLOAD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          UPLOAD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.release.outputs.mode }}" == 'auto' ]]; then
            ARTIFACT_RUN_ID=$GITHUB_RUN_ID
            ARTIFACT_ID=$UPLOAD_ARTIFACT_ID
            ARTIFACT_DIGEST=sha256:$UPLOAD_ARTIFACT_DIGEST
            SOURCE_SHA=${{ steps.release.outputs.base-sha }}
          else
            ARTIFACT_RUN_ID=$INPUT_RUN_ID
            ARTIFACT_ID=$INPUT_ARTIFACT_ID
            ARTIFACT_DIGEST=$INPUT_ARTIFACT_DIGEST
            SOURCE_SHA=$INPUT_SOURCE_SHA
          fi
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Source run ID must be a positive integer.'
            exit 1
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Source artifact ID must be a positive integer.'
            exit 1
          }
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Source artifact digest must be SHA-256.'
            exit 1
          }
          [[ "$SOURCE_SHA" == "${{ steps.release.outputs.base-sha }}" ]] || {
            echo '::error::Source SHA does not match the release parent.'
            exit 1
          }
          {
            echo "artifact-run-id=$ARTIFACT_RUN_ID"
            echo "artifact-id=$ARTIFACT_ID"
            echo "artifact-digest=$ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Verify source artifact identity
        if: steps.release.outputs.mode == 'tag'
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_RUN_ID: ${{ steps.artifact.outputs.artifact-run-id }}
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          METADATA=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          [[ $(jq -r '.id' <<< "$METADATA") == "$ARTIFACT_ID" ]]
          [[ $(jq -r '.workflow_run.id // empty' <<< "$METADATA") == "$ARTIFACT_RUN_ID" ]]
          [[ $(jq -r '.workflow_run.head_branch // empty' <<< "$METADATA") == 'main' ]]
          [[ $(jq -r '.workflow_run.head_sha // empty' <<< "$METADATA") == "$BASE_SHA" ]]
          [[ $(jq -r '.digest // empty' <<< "$METADATA") == "$ARTIFACT_DIGEST" ]]
          [[ $(jq -r '.expired' <<< "$METADATA") == 'false' ]]

      - name: Download source artifact
        if: steps.release.outputs.mode == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/publish-bundle
          merge-multiple: true

      - name: Verify source artifact files
        id: publication
        if: steps.release.outputs.mode == 'tag'
        env:
          ARTIFACT_RUN_ID: ${{ steps.artifact.outputs.artifact-run-id }}
          BASE_SHA: ${{ steps.release.outputs.base-sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_CONTROL_SHA: ${{ steps.control.outputs.publish-sha }}
          RELEASE_CONTROL_SHA: ${{ steps.control.outputs.release-sha }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/publish-bundle"
          cd "$BUNDLE"
          sha256sum --check SHA256SUMS
          [[ $(sha256sum publish-packages.sh | cut -d' ' -f1) == "$PUBLISH_CONTROL_SHA" ]]
          EXPECTED="$RUNNER_TEMP/expected-release-provenance"
          printf '%s\n' \
            'format=1' \
            "base_sha=$BASE_SHA" \
            "version=$EXPECTED_VERSION" \
            "source_run_id=$ARTIFACT_RUN_ID" \
            "publish_control_sha=$PUBLISH_CONTROL_SHA" \
            "release_control_sha=$RELEASE_CONTROL_SHA" > "$EXPECTED"
          cmp "$EXPECTED" RELEASE_PROVENANCE
          PUBLICATION_OUTPUT="$GITHUB_OUTPUT" bash publish-packages.sh validate agent-app.tgz create-agent-app.tgz
          # A legacy retained control must never turn missing outputs into a
          # successful workflow that silently skips both publications.
          for package in agent-app create-agent-app; do
            grep -Eq "^$package-pending=(true|false)$" "$GITHUB_OUTPUT" || {
              echo "::error::Source publication control did not report registry state for $package."
              exit 1
            }
          done
