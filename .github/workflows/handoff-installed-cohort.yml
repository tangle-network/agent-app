name: Handoff installed cohort
on:
  push:
    branches: [verify/handoff-installed-cohort-20260913]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Read published package metadata
        run: |
          mkdir -p proof
          npm view @tangle-network/hub-sdk versions version peerDependencies engines --json > proof/hub.json
          npm view @tangle-network/agent-app@0.47.13 version peerDependencies --json > proof/app.json
          npm view @tangle-network/agent-runtime@0.207.0 version peerDependencies --json > proof/runtime.json
          npm view @tangle-network/agent-integrations versions version --json > proof/integrations.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: handoff-published-metadata
          path: proof/
          retention-days: 3
          if-no-files-found: error
