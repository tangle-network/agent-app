name: Handoff installed cohort
on:
  push:
    branches: [verify/handoff-installed-cohort-20260913]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve compatible current published versions
        run: |
          mkdir -p consumer proof
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const dependencies = ['@opentelemetry/exporter-trace-otlp-http','@opentelemetry/resources','@opentelemetry/sdk-trace-node','@tangle-network/agent-app','@tangle-network/agent-eval','@tangle-network/agent-integrations','@tangle-network/agent-interface','@tangle-network/agent-runtime','@tangle-network/hub-sdk','@tangle-network/sandbox','better-auth','drizzle-orm','viem'];
          const devDependencies = ['@cloudflare/workers-types','@types/node','typescript','wrangler','esbuild'];
          const manifest = {name:'handoff-agent', version:'0.9.0', private:true, type:'module', dependencies:{}, devDependencies:{}};
          const evidence = {resolvedAt:new Date().toISOString(), packages:{}, selections:{}};
          const read = (...args) => JSON.parse(execFileSync('npm',['view', ...args, '--json'], {encoding:'utf8'}));
          const metadata = (name, tag = 'latest') => {
            const versions = read(`${name}@${tag}`, 'version');
            const version = Array.isArray(versions) ? versions.at(-1) : versions;
            return read(`${name}@${version}`, 'version', 'gitHead', 'engines', 'dist', 'peerDependencies', 'peerDependenciesMeta');
          };
          const app = metadata('@tangle-network/agent-app');
          for (const kind of ['dependencies','devDependencies']) {
            for (const name of kind === 'dependencies' ? dependencies : devDependencies) {
              const latest = metadata(name, name === '@types/node' ? '22' : 'latest');
              const range = name.startsWith('@tangle-network/') ? app.peerDependencies?.[name] : undefined;
              const item = range ? metadata(name,range) : latest;
              manifest[kind][name] = item.version;
              evidence.packages[name] = item;
              evidence.selections[name] = {latest:latest.version,selected:item.version,...(range?{peerRange:range,peerOwner:`@tangle-network/agent-app@${app.version}`}:{})};
              writeFileSync('proof/published-metadata.json',JSON.stringify(evidence,null,2)+'\n');
            }
          }
          evidence.gateway = metadata('@tangle-network/agent-gateway');
          writeFileSync('consumer/package.json', JSON.stringify(manifest,null,2)+'\n');
          writeFileSync('proof/published-metadata.json',JSON.stringify(evidence,null,2)+'\n');
          JS
      - name: Install without bypassing peer validation
        run: |
          cd consumer
          npm install --ignore-scripts --no-audit --no-fund > ../proof/install.log 2>&1 || { tail -80 ../proof/install.log; exit 1; }
          npm ls --all --json > ../proof/dependencies.json
          cp package.json package-lock.json ../proof/
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const channels = await import('@tangle-network/agent-integrations/conversation-events');
          const hub = await import('@tangle-network/hub-sdk');
          const report = {channelExports:Object.keys(channels), channels:channels.listConversationChannels?.() ?? null, hubExports:Object.keys(hub)};
          writeFileSync('../proof/messaging-exports.json',JSON.stringify(report,null,2));
          JS
          tar -czf ../proof/installed-cohort.tar.gz package.json package-lock.json node_modules
          sha256sum ../proof/installed-cohort.tar.gz > ../proof/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: handoff-latest-cohort
          path: proof/
          retention-days: 7
          if-no-files-found: error
