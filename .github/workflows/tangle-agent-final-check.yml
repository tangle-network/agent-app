name: Final general agent merge and executable check
on:
  push:
    branches: [feat/default-agent-home]
    paths: [.github/workflows/tangle-agent-final-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/default-agent-home
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Merge actual current main without hiding a failed merge
        run: |
          set -euo pipefail
          mkdir -p verification
          git config user.name tangletools
          git config user.email hello@tangle.tools
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            test -f .git/MERGE_HEAD
          fi
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          print('Actual merge conflicts:',conflicts)
          assert all(p in {'package.json','pnpm-lock.yaml','src/hosted-agent/index.ts'} or p.startswith('docs/') for p in conflicts),conflicts
          if 'package.json' in conflicts:
            base=json.loads(git('show',':1:package.json')); ours=json.loads(git('show',':2:package.json')); theirs=json.loads(git('show',':3:package.json'))
            absent=object()
            def merge(b,o,t,path=()):
              if path==('version',): return t
              if o==b: return t
              if t==b or o==t: return o
              if all(isinstance(x,dict) for x in (b,o,t)):
                out={}
                for k in b.keys()|o.keys()|t.keys():
                  v=merge(b.get(k,absent),o.get(k,absent),t.get(k,absent),path+(k,))
                  if v is not absent: out[k]=v
                return out
              if path and path[0]=='peerDependencies' and isinstance(o,str) and isinstance(t,str):
                return ' || '.join(dict.fromkeys(t.split(' || ')+o.split(' || ')))
              raise RuntimeError(('Unreviewed package conflict',path))
            Path('package.json').write_text(json.dumps(merge(base,ours,theirs),indent=2)+'\n')
            subprocess.run(['git','add','package.json'],check=True)
          if 'src/hosted-agent/index.ts' in conflicts:
            ours=git('show',':2:src/hosted-agent/index.ts'); theirs=git('show',':3:src/hosted-agent/index.ts')
            pattern=r'function conversationProfile\(profile: AgentProfile\): AgentProfile \{[\s\S]*?\n\}\n'
            body=re.search(pattern,ours); assert body
            theirs,n=re.subn(pattern,lambda _:body.group(0),theirs,count=1); assert n==1
            tools=re.search(r'export const CONVERSATION_TOOLS_OFF = .*? as const',ours); assert tools
            theirs,n=re.subn(r'export const CONVERSATION_TOOLS_OFF = .*? as const',lambda _:tools.group(0),theirs,count=1); assert n==1
            if "import { withDefaultAgentHome } from '../profile/home'" not in theirs:
              theirs="import { withDefaultAgentHome } from '../profile/home'\n"+theirs
            marker='export type HostedAgent = ReturnType<typeof createHostedAgent>'
            assert marker in ours and marker in theirs
            tail=ours.split(marker,1)[1]
            theirs=theirs.split(marker,1)[0]+marker+tail
            Path('src/hosted-agent/index.ts').write_text(theirs)
            subprocess.run(['git','add','src/hosted-agent/index.ts'],check=True)
          for p in conflicts:
            if p=='pnpm-lock.yaml' or p.startswith('docs/'):
              subprocess.run(['git','checkout','--theirs','--',p],check=True)
              subprocess.run(['git','add',p],check=True)
          PY
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile 2>&1 | tee verification/resolve.log
          git add package.json pnpm-lock.yaml
          git rm .github/workflows/tangle-agent-final-check.yml
          git diff --check
          git commit -m 'Merge current main into the general-agent implementation'
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:feat/default-agent-home
          git rev-parse HEAD > verification/REVISION
      - name: Install and compile actual code
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee verification/install.log
          pnpm typecheck 2>&1 | tee verification/types.log
          pnpm build 2>&1 | tee verification/build.log
      - name: Exercise home restart, actual profile parsing and package imports
        run: |
          set -euo pipefail
          node --input-type=module <<'JS' 2>&1 | tee verification/runtime.log
          import { mkdtemp, writeFile, readFile, unlink, stat } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import assert from 'node:assert/strict'
          import { initializeHome, checkpointHome } from './bin/tangle-agent/home.mjs'
          import { buildGeneralAgent } from './bin/tangle-agent/provision.mjs'
          const home=await mkdtemp(join(tmpdir(),'tangle-agent-home-'))
          await initializeHome(home)
          await writeFile(join(home,'MEMORY.md'),'Persistence probe: real local filesystem.\n')
          await unlink(join(home,'BOOTSTRAP.md'))
          const checkpoint=await checkpointHome(home)
          await initializeHome(home)
          assert.match(await readFile(join(home,'MEMORY.md'),'utf8'), /Persistence probe/)
          await assert.rejects(stat(join(home,'BOOTSTRAP.md')), {code:'ENOENT'})
          const plan=buildGeneralAgent({version:1,keyPrefix:'probe:',environment:'universal',imageModel:'probe-image',videoModel:'probe-video',chromium:'/usr/bin/chromium',members:[{address:'+15550100001',role:'owner',label:'Probe'}],lines:[{id:'ln_probe',transport:'imessage'}]})
          assert.equal(plan.attachments[0].instance.create.resources.memoryMB,4096)
          assert.equal(plan.attachments[0].instance.create.egressPolicy.mode,'strict')
          assert.equal(plan.attachments[0].respond.rolePolicy.roles.owner.kind,'general')
          console.log(JSON.stringify({checkpoint,bootstrap:'not recreated',memory:'retained',profile:'parsed',network:'not invoked'}))
          await import('./bin/tangle-agent/runtime.mjs')
          console.log('Published BrowserAgent, TCloud and MCP imports resolved; no provider request sent.')
          JS
      - name: Regenerate docs and confirm packaged executable
        run: |
          set -euo pipefail
          pnpm docs:gen 2>&1 | tee verification/docs.log
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'docs: regenerate the merged general-agent API'
            git push origin HEAD:feat/default-agent-home
          fi
          pnpm pack --pack-destination verification
          tar -tf verification/tangle-network-agent-app-*.tgz | grep 'package/bin/tangle-agent' | tee verification/packed-paths.log
          git rev-parse HEAD > verification/REVISION
      - name: Record exact source
        if: always()
        run: |
          mkdir -p verification
          git archive --format=tar HEAD > verification/source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: general-agent-final-merge-${{ github.run_id }}
          path: verification/
          retention-days: 3
