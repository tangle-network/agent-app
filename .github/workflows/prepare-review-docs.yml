name: Prepare review API documentation
on:
  pull_request:
    paths: ['.github/workflows/prepare-review-docs.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'tangle-network/agent-app' && github.event.pull_request.number == 710 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify the exact reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/work-product/service.ts)" = ad576a4dc24b264c41a92ea20e48286bfdb5c089
          test "$(git hash-object src/work-product/route.ts)" = 1bf845e5034d8c41ff4cc4d66e85229ebbead157
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:gen
      - name: Retain generated Git objects without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = ['docs/api/work-product.md', 'docs/codemap.json', 'docs/llms-full.txt'].sort();
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean).sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw Error('Unexpected generated-document scope');
          for (const path of expected) {
            const bytes = readFileSync(path);
            const response = await fetch('https://api.github.com/repos/tangle-network/agent-app/git/blobs', {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'x-github-api-version': '2022-11-28' },
              body: JSON.stringify({ content: bytes.toString('base64'), encoding: 'base64' }),
            });
            if (!response.ok) throw Error(`Generated blob retention failed: HTTP ${response.status}`);
            const result = await response.json();
            console.log(JSON.stringify({ path, gitBlob: result.sha, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }));
          }
          JS
