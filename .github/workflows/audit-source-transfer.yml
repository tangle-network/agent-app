name: Verify generated recovery documentation
on:
  push:
    branches: [audit-transfer/recovery-contract-20260918]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select the exact reviewed source without this workflow
        run: |
          git checkout --detach f16426d62e081394fbb247efede09e45be59d170
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test-quality.test.ts')
          s = p.read_text()
          old = r'  /\bassert[A-Za-z]*\s*\(/, // assert(...) and assertSomething(...) — throwing helpers'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n' + r'  /\bassert\.(?:ok|equal|strictEqual|deepEqual|deepStrictEqual|notEqual|notStrictEqual|notDeepEqual|notDeepStrictEqual|throws|doesNotThrow|match|doesNotMatch|ifError|fail)\s*\(/, // node:assert methods throw on a failed assertion')
          needle = "  it('no test body is assertion-free', () => {"
          addition = """  it.each(['equal', 'deepEqual', 'ok', 'throws', 'match'])('recognizes callable node:assert.%s assertions', (method) => {
              const body = `{ assert.${method}(actual, expected) }`
              expect(ASSERTION_SIGNALS.some(signal => signal.test(body))).toBe(true)
            })

            it.each(['{ assert.equal }', '{ assert.unrecognized(actual) }'])('does not count an assertion reference or unknown method: %s', (body) => {
              expect(ASSERTION_SIGNALS.some(signal => signal.test(body))).toBe(false)
            })

          """
          # Normalize only the indentation introduced by this Python literal.
          addition = addition.splitlines(keepends=True)
          addition = ''.join([addition[0], *[line[2:] if line.startswith('  ') else line for line in addition[1:]]])
          assert s.count(needle) == 1
          s = s.replace(needle, addition + needle)
          p.write_text(s)
          import hashlib
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'cb83ca5a2e3845e395b29708da450b2e6787153e43ab3d6a1e27b3f2b289271e'
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Regenerate existing references and verify package source
        run: |
          set -o pipefail
          pnpm docs:gen |& tee "$RUNNER_TEMP/docs.log"
          git add docs tests/test-quality.test.ts
          pnpm typecheck |& tee "$RUNNER_TEMP/typecheck.log"
          pnpm test -- --maxWorkers=2 |& tee "$RUNNER_TEMP/tests.log"
          pnpm docs:gen
          git diff --exit-code
      - name: Retain the verified source tree
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs'); const path = require('node:path');
            const crypto = require('node:crypto'); const assert = require('node:assert/strict');
            const { execFileSync } = require('node:child_process');
            const expected = {
              'docs/CODEMAP.md': 'a6ad0da1514a57312617fc2d174889687fa007888ce653d890758f95cdcb26d0',
              'docs/api/chat-routes.md': 'b2e3e7c6b12f716f838c328e05d471de566fd4ce1fbf0dffe58be32b9b56a557',
              'docs/api/preset-cloudflare.md': 'b5472ad2b68de72b7d23b9df69831333508a794ffcd9bcf5c28dfd2a62889d8a',
              'docs/api/stream.md': 'd9f994168d9ed4a0fff4e4c8cd3fcfd9d5b064a86c83f5a52ef78c362fc8bc6c',
              'docs/api/web.md': 'fc4f6914252e2aa859c6914366c082fa857aed709e23316edd8980d0fc1656e9',
              'docs/codemap.json': '9fc84499a9ca907bbecbd9a1d01cfdddda15a86a96a843702aa7bfa064d94d44',
              'docs/llms-full.txt': '8eadb1026cb0dd38c0b3ae1019f7499588c1df1213c3130aa6dd5c0df9246b8d',
              'docs/llms.txt': '0a9eb742882b790bc896e93eb8775f3d7ec2c769d170565fa2b907eb7c645680',
              'tests/test-quality.test.ts': 'cb83ca5a2e3845e395b29708da450b2e6787153e43ab3d6a1e27b3f2b289271e',
            };
            const parent = 'f16426d62e081394fbb247efede09e45be59d170';
            const { owner, repo } = context.repo;
            const actual = execFileSync('git', ['diff','--cached','--name-only'], {encoding:'utf8'}).trim().split('\n').sort();
            assert.deepEqual(actual, Object.keys(expected).sort());
            const current = await github.rest.git.getRef({owner,repo,ref:'heads/fix/exact-recovery-contract'});
            assert.equal(current.data.object.sha,parent,'Reviewed branch changed');
            const entries = [];
            for (const [file,digest] of Object.entries(expected)) {
              const content = fs.readFileSync(file);
              assert.equal(crypto.createHash('sha256').update(content).digest('hex'),digest,file);
              const blob = await github.rest.git.createBlob({owner,repo,content:content.toString('base64'),encoding:'base64'});
              entries.push({path:file,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const created = await github.rest.git.createTree({owner,repo,base_tree:'ecd277731952cc918f32fdb1181efa38362e5879',tree:entries});
            assert.equal(created.data.sha,execFileSync('git',['write-tree'],{encoding:'utf8'}).trim());
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'verified-tree.json'),JSON.stringify({repository:`${owner}/${repo}`,parent,tree:created.data.sha,files:expected,runId:context.runId},null,2));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-recovery-docs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/verified-tree.json
            ${{ runner.temp }}/docs.log
            ${{ runner.temp }}/typecheck.log
            ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 3
