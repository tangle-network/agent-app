name: Verify isolated recovery source
on:
  push:
    branches: [audit-transfer/recovery-contract-20260918]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Restore the exact candidate on its upstream parent
        run: |
          cp .audit-transfer/manifest.json "$RUNNER_TEMP/manifest.json"
          cp .audit-transfer/source.patch "$RUNNER_TEMP/source.patch"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest=json.loads((root/'manifest.json').read_text())
          assert hashlib.sha256((root/'source.patch').read_bytes()).hexdigest()==manifest['patchSha256']
          subprocess.run(['git','checkout','--detach',manifest['base']],check=True)
          subprocess.run(['git','apply','--check',str(root/'source.patch')],check=True)
          subprocess.run(['git','apply','--index',str(root/'source.patch')],check=True)
          subprocess.run(['git','rm',manifest['deleted']],check=True)
          PY
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Verify existing and new recovery contracts
        run: |
          set -o pipefail
          pnpm exec vitest run tests/chat-routes src/preset-cloudflare/detached-turn-workflow.test.ts tests/preset-cloudflare/detached-turn-workflow-recovery.test.ts --maxWorkers=2 |& tee "$RUNNER_TEMP/tests.log"
          pnpm typecheck |& tee "$RUNNER_TEMP/typecheck.log"
          git diff --exit-code -- src tests docs package.json pnpm-lock.yaml
      - name: Store verified source tree without changing a branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs'); const path = require('node:path'); const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process'); const assert = require('node:assert/strict');
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'manifest.json'), 'utf8'));
            const { owner, repo } = context.repo;
            const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            assert.equal(current.data.object.sha, manifest.base, 'Upstream changed; reconcile before publication');
            const actual = execFileSync('git', ['diff', '--cached', '--name-only'], {encoding:'utf8'}).trim().split('\n').sort();
            assert.deepEqual(actual, [...Object.keys(manifest.files), manifest.deleted].sort());
            const tree = [];
            for (const [file, digest] of Object.entries(manifest.files)) {
              assert.match(file, /^(src|tests|docs)\//); assert.ok(!file.split('/').includes('..'));
              const content = fs.readFileSync(file);
              assert.equal(crypto.createHash('sha256').update(content).digest('hex'), digest, `Changed candidate: ${file}`);
              const blob = await github.rest.git.createBlob({owner, repo, content: content.toString('base64'), encoding:'base64'});
              tree.push({path:file, mode:'100644', type:'blob', sha:blob.data.sha});
            }
            tree.push({path:manifest.deleted, mode:'100644', type:'blob', sha:null});
            const created = await github.rest.git.createTree({owner, repo, base_tree:manifest.tree, tree});
            assert.equal(created.data.sha, execFileSync('git', ['write-tree'], {encoding:'utf8'}).trim());
            const receipt = {repository:`${owner}/${repo}`, parent:manifest.base, tree:created.data.sha, files:manifest.files, deleted:manifest.deleted, verification:'frozen install; chat-routes and Workflow tests; full source typecheck', runId:context.runId};
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'verified-tree.json'), JSON.stringify(receipt,null,2));
            console.log(JSON.stringify(receipt));
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verified-recovery-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/verified-tree.json
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/typecheck.log
          if-no-files-found: ignore
          retention-days: 3
