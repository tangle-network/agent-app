name: Reconcile and build Tangle agent v1
on:
  push:
    branches: [feat/default-agent-home]
    paths: [.github/workflows/tangle-agent-reconcile.yml]
permissions:
  contents: write
concurrency:
  group: tangle-agent-v1-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'tangle-network/agent-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/default-agent-home
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Reconcile the reviewed conflicts without discarding upstream API changes
        run: |
          set -euo pipefail
          mkdir -p verification
          git config user.name drewstone
          git config user.email drewstone329@gmail.com
          git fetch origin main
          git rev-parse HEAD > verification/START
          git rev-parse origin/main > verification/MAIN
          if ! git merge --no-commit --no-ff origin/main; then test -f .git/MERGE_HEAD; fi
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { writeFileSync, readFileSync } from 'node:fs'
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' })
          const conflicts = git('diff', '--name-only', '--diff-filter=U').trim().split('\n').filter(Boolean)
          const allowed = new Set(['package.json', 'pnpm-lock.yaml', 'src/hosted-agent/index.ts', 'tests/hosted-agent.test.ts'])
          if (conflicts.some(path => !allowed.has(path) && !path.startsWith('docs/'))) throw new Error(`Unreviewed conflicts: ${conflicts}`)
          const ours = JSON.parse(git('show', 'HEAD:package.json'))
          const next = JSON.parse(git('show', 'origin/main:package.json'))
          next.bin['tangle-agent'] = ours.bin['tangle-agent']
          const optional = ['@modelcontextprotocol/sdk', '@tangle-network/browser-agent-driver', '@tangle-network/hub-sdk', '@tangle-network/tcloud', 'playwright']
          for (const name of [...optional, '@anthropic-ai/sdk', '@ai-sdk/google', '@ai-sdk/anthropic']) next.devDependencies[name] = ours.devDependencies[name]
          for (const name of optional) {
            next.peerDependencies[name] = ours.peerDependencies[name]
            next.peerDependenciesMeta[name] = { optional: true }
          }
          next.peerDependencies['@tangle-network/agent-integrations'] = ours.peerDependencies['@tangle-network/agent-integrations']
          next.peerDependencies['@tangle-network/sandbox'] = ours.peerDependencies['@tangle-network/sandbox']
          // Resolve the published Runtime's actual Eval range, not the incompatible
          // 0.197/0.277 pairing recently added to main. Record exact resolved pins.
          const runtimeVersion = next.devDependencies['@tangle-network/agent-runtime']
          const runtime = JSON.parse(execFileSync('npm', ['view', `@tangle-network/agent-runtime@${runtimeVersion}`, '--json'], { encoding: 'utf8' }))
          const versions = JSON.parse(execFileSync('npm', ['view', `@tangle-network/agent-eval@${runtime.peerDependencies['@tangle-network/agent-eval']}`, 'version', '--json'], { encoding: 'utf8' }))
          next.devDependencies['@tangle-network/agent-eval'] = Array.isArray(versions) ? versions.at(-1) : versions
          if (runtime.dependencies?.['@tangle-network/agent-knowledge']) next.devDependencies['@tangle-network/agent-knowledge'] = runtime.dependencies['@tangle-network/agent-knowledge']
          writeFileSync('package.json', JSON.stringify(next, null, 2) + '\n')
          git('checkout', 'origin/main', '--', 'pnpm-lock.yaml', 'tests/hosted-agent.test.ts')
          // The current PR file already preserves personal/shared, email, WhatsApp,
          // and voice options. Keep that implementation and its chat-only guest.
          writeFileSync('src/hosted-agent/index.ts', git('show', 'HEAD:src/hosted-agent/index.ts'))
          const testPath = 'tests/hosted-agent.test.ts'
          const test = readFileSync(testPath, 'utf8')
          const oldGuest = "guest: { context: 'own', tools: 'act' }"
          if (!test.includes(oldGuest)) throw new Error('Upstream guest assertion changed; review it instead of guessing')
          writeFileSync(testPath, test.replaceAll(oldGuest, "guest: { context: 'own', tools: 'chat' }"))
          for (const path of conflicts.filter(path => path.startsWith('docs/'))) git('checkout', 'origin/main', '--', path)
          git('add', 'package.json', 'pnpm-lock.yaml', 'src/hosted-agent/index.ts', 'tests/hosted-agent.test.ts', 'docs')
          if (git('diff', '--name-only', '--diff-filter=U').trim()) throw new Error('Unresolved merge')
          console.log(JSON.stringify({ runtime: runtimeVersion, eval: next.devDependencies['@tangle-network/agent-eval'], knowledge: next.devDependencies['@tangle-network/agent-knowledge'] }))
          JS
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile 2>&1 | tee verification/resolve.log
      - name: Build the actual merged package and regenerate its API documentation
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee verification/install.log
          pnpm typecheck 2>&1 | tee verification/types.log
          pnpm build 2>&1 | tee verification/build.log
          pnpm docs:gen 2>&1 | tee verification/docs.log
          find bin/tangle-agent -name '*.mjs' -exec node --check '{}' \;
          python3 -m py_compile bin/tangle-agent/home-maintenance.py
      - name: Exercise installed ownership, caps, Git and sudo as a separate real UID
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash tangleproof
          sudo "$(command -v node)" bin/tangle-agent.mjs install-home tangleproof | tee verification/home-install.json
          sudo -u tangleproof env TANGLE_HOME_PROOF_DISPOSABLE=1 "$(command -v node)" "$PWD/scripts/prove-protected-home.mjs" | tee verification/home-proof.jsonl
          pnpm pack --pack-destination verification
          tar -tf verification/tangle-network-agent-app-*.tgz | grep 'package/bin/tangle-agent' > verification/packed-paths.txt
      - name: Commit only the verified reconciliation to the requested PR
        run: |
          set -euo pipefail
          git rm .github/workflows/tangle-agent-reconcile.yml .github/workflows/tangle-agent-final-check.yml
          git add package.json pnpm-lock.yaml src/hosted-agent/index.ts tests/hosted-agent.test.ts docs
          git diff --cached --check
          git commit -m 'Merge current main and verify the protected general-agent runtime'
          git merge-base --is-ancestor "$(cat verification/MAIN)" HEAD
          git push origin HEAD:feat/default-agent-home
          git rev-parse HEAD > verification/REVISION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tangle-agent-v1-reconciliation-${{ github.run_id }}
          path: verification/
          retention-days: 3
          if-no-files-found: error
