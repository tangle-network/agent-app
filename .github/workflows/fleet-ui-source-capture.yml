name: Fleet UI source capture
on:
  push:
    branches: [verify/fleet-ui-parity-20261003]
    paths: [.github/workflows/fleet-ui-source-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-ui"
          cd "$RUNNER_TEMP/fleet-ui"
          for repo in agent-app gtm-agent tax-agent legal-agent physim insurance-agent relationships-agent creative-agent; do
            gh api "repos/tangle-network/$repo" > "$repo.repository.json"
            test "$(jq -r .private "$repo.repository.json")" = false
            ref=$(jq -r .default_branch "$repo.repository.json")
            sha=$(gh api "repos/tangle-network/$repo/commits/$ref" --jq .sha)
            printf '%s\t%s\t%s\n' "$repo" "$ref" "$sha" >> revisions.tsv
            gh api "repos/tangle-network/$repo/tarball/$sha" > "$repo.tar.gz"
            sha256sum "$repo.tar.gz" >> sha256sums.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fleet-ui-public-sources
          path: ${{ runner.temp }}/fleet-ui
          retention-days: 3
          if-no-files-found: error
