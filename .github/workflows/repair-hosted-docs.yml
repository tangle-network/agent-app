name: Regenerate reviewed hosted API docs
on:
  push:
    branches: [fix/hosted-assistant-layering]
    paths: [.github/workflows/repair-hosted-docs.yml]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'tangle-network/agent-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts=false
      - name: Generate and commit only the reviewed documentation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          pnpm docs:gen
          git add docs/CODEMAP.md docs/api/hosted-agent.md docs/codemap.json docs/llms-full.txt docs/llms.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'drewstone'
          git config user.email 'drewstone@users.noreply.github.com'
          git commit -m 'docs(hosted-agent): regenerate API references after review fixes'
          # A normal push refuses concurrent changes. Never overwrite another writer.
          test "$(git ls-remote origin refs/heads/fix/hosted-assistant-layering | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/hosted-assistant-layering
          git rev-parse HEAD
