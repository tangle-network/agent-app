name: Workspace line source snapshot
on:
  push:
    branches: [ops/workspace-lines-source-20260928]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 100f9660e3fe378cde85b876554c646293ab07d9
          persist-credentials: false
      - run: |
          mkdir -p /tmp/source
          git rev-parse HEAD > /tmp/source/head.txt
          git archive HEAD -o /tmp/source/source.tar.gz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: cp "$(command -v node)" /tmp/source/node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-lines-source
          path: /tmp/source/
          retention-days: 3
