name: Complete native customer cohort
on:
  push:
    branches: [feat/current-customer-cohort]
permissions:
  contents: write
concurrency:
  group: current-customer-cohort
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'tangle-network/agent-app' && github.ref == 'refs/heads/feat/current-customer-cohort'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERIFICATION_DIR: /tmp/current-customer-cohort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require the normally published Runtime release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if pnpm view @tangle-network/agent-runtime@0.247.0 version --json > /tmp/runtime-version.json 2>/dev/null && node -e "if(require('/tmp/runtime-version.json')!=='0.247.0') process.exit(1)"; then exit 0; fi
            sleep 10
          done
          echo '::error::Runtime 0.247.0 is not available; do not substitute an older or unpublished implementation.'
          exit 1
      - name: Prepare the explicitly reviewed dependency migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VERIFICATION_DIR"
          git rev-parse HEAD > "$VERIFICATION_DIR/base.txt"
          node scripts/verify-current-cohort.mjs
          pnpm install --no-frozen-lockfile --ignore-scripts=false > "$VERIFICATION_DIR/install.log" 2>&1 || { tail -100 "$VERIFICATION_DIR/install.log"; exit 1; }
          pnpm docs:gen > "$VERIFICATION_DIR/docs.log" 2>&1 || { tail -80 "$VERIFICATION_DIR/docs.log"; exit 1; }
      - name: Retain an ordinary candidate commit without the temporary workbench
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/verify-current-cohort.mjs .github/workflows/current-cohort-workbench.yml
          python3 <<'PY'
          import subprocess
          allowed = {
            'package.json', 'pnpm-lock.yaml',
            'create-agent-app/template/_package.json',
            'create-agent-app/template-chat/_package.json',
            'src/peer-floors/check.test.ts',
            'create-agent-app/template-chat/src/sandbox.ts',
            'create-agent-app/template-chat/tests/chat-turn.e2e.test.ts',
            'scripts/verify-current-cohort.mjs',
            '.github/workflows/current-cohort-workbench.yml',
            'docs/api/runtime.md', 'docs/codemap.json', 'docs/llms-full.txt',
            'docs/llms.txt', 'docs/CODEMAP.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed - allowed:
            raise SystemExit(f'Unexpected generated source paths: {sorted(changed - allowed)}')
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          PY
          git diff --cached --check
          git config user.name "$(git show -s --format=%an HEAD)"
          git config user.email "$(git show -s --format=%ae HEAD)"
          git commit -m 'feat: adopt current native controls and shared certified delivery'
          git rev-parse HEAD > "$VERIFICATION_DIR/candidate.txt"
          git archive --format=tar.gz HEAD > "$VERIFICATION_DIR/source.tar.gz"
          git diff "$(cat "$VERIFICATION_DIR/base.txt")" HEAD > "$VERIFICATION_DIR/retained.patch"
      - name: Capture the installed development toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/cohort-toolchain"
          tar -czf "$RUNNER_TEMP/cohort-toolchain/dependencies.tar.gz" node_modules
          tar -czf "$RUNNER_TEMP/cohort-toolchain/node-runtime.tar.gz" -C "$(dirname "$(dirname "$(command -v node)")")" bin lib
          cp "$VERIFICATION_DIR/source.tar.gz" "$VERIFICATION_DIR/candidate.txt" "$RUNNER_TEMP/cohort-toolchain/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-cohort-toolchain
          path: ${{ runner.temp }}/cohort-toolchain/
          retention-days: 1
          compression-level: 0
      - name: Run the unchanged source-head merge gate
        id: signoff
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm signoff --source head --keep-going --json "$VERIFICATION_DIR/signoff.json" > "$VERIFICATION_DIR/signoff.log" 2>&1 || { tail -160 "$VERIFICATION_DIR/signoff.log"; exit 1; }
      - name: Independently check the structured source-suite report
        id: report
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --maxWorkers=2 --reporter=json --outputFile="$VERIFICATION_DIR/tests.json" > "$VERIFICATION_DIR/tests.log" 2>&1 || { tail -100 "$VERIFICATION_DIR/tests.log"; exit 1; }
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(`${process.env.VERIFICATION_DIR}/tests.json`, 'utf8'));
          if (!result.success || result.numFailedTests !== 0 || result.numFailedTestSuites !== 0 || result.numPassedTests < 6300) {
            throw new Error('Structured source-suite report is not passing');
          }
          JS
      - name: Push only the verified candidate to the unchanged feature branch
        if: steps.signoff.outcome == 'success' && steps.report.outcome == 'success'
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$VERIFICATION_DIR/candidate.txt")"
          test -z "$(git status --porcelain)"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/feat/current-customer-cohort | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/current-customer-cohort
          printf 'pushed\n' > "$VERIFICATION_DIR/pushed.txt"
      - name: Keep diagnostic evidence even when a check fails
        if: always()
        shell: bash
        run: |
          mkdir -p "$VERIFICATION_DIR"
          cp package.json pnpm-lock.yaml "$VERIFICATION_DIR/"
          git diff --binary > "$VERIFICATION_DIR/working-tree.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-customer-cohort-signoff
          path: ${{ env.VERIFICATION_DIR }}/
          retention-days: 7
      - name: Require the exact source gate, structured suite and guarded push
        if: always()
        env:
          SIGNOFF: ${{ steps.signoff.outcome }}
          REPORT: ${{ steps.report.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SIGNOFF" = success
          test "$REPORT" = success
          test "$(cat "$VERIFICATION_DIR/pushed.txt")" = pushed
