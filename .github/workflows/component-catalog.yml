name: Component catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every catalog deployment retains its own build and immutable artifact.
concurrency:
  group: component-catalog-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-catalog.yml
    with:
      build-only: true
    # The reusable workflow declares deploy permissions as a ceiling. Its build
    # job reduces the actual token to contents: read and receives no secrets.
    permissions:
      contents: read
      deployments: write

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main'
    uses: tangle-network/agent-app/.github/workflows/deploy-catalog.yml@28c882cb570fa4103fd1265eb390090bfb86fee7
    permissions:
      contents: read
      deployments: write
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
