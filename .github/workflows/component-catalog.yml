name: Component catalog

on:
  push:
    branches: [main]
    # Catalog/package inputs and the generated-template signoff contract.
    # Documentation and test-only pushes do not publish an unchanged catalog.
    paths:
      - '.storybook/**'
      - 'src/**'
      - 'create-agent-app/index.mjs'
      - 'create-agent-app/package.json'
      - 'create-agent-app/template*/**'
      - 'create-agent-app/proof/workspace-browser.mjs'
      - 'bin/**'
      - '.github/scripts/test-generated-projects.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'tsup.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - 'signoff.config.mjs'
      - 'knip.ts'
      - '.github/workflows/component-catalog.yml'
      - '.github/workflows/deploy-catalog.yml'
      - '!**/*.test.*'
      - '!**/*.spec.*'
      - '!**/__tests__/**'
      - '!**/tests/**'
  workflow_dispatch:

permissions:
  contents: read

# Every catalog deployment retains its own build and immutable artifact.
concurrency:
  group: component-catalog-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-catalog.yml
    with:
      build-only: true
    # The reusable workflow declares deploy/report permissions as a ceiling.
    # Its build job uses contents: read and receives no secrets.
    permissions:
      contents: read
      deployments: write
      issues: write

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main'
    uses: tangle-network/agent-app/.github/workflows/deploy-catalog.yml@28c882cb570fa4103fd1265eb390090bfb86fee7
    permissions:
      contents: read
      deployments: write
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  post-release-suites:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-catalog.yml
    with:
      suites-only: true
    # Only the report job can write issues. Suites use contents: read and
    # receive no deployment secrets; their result cannot block deployment.
    permissions:
      contents: read
      deployments: write
      issues: write
