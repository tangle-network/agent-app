name: Reconcile general agent with current main
on:
  push:
    branches: [feat/default-agent-home]
    paths: [.github/workflows/tangle-agent-sync-main.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/default-agent-home
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Merge without discarding upstream behavior
        run: |
          set -euo pipefail
          mkdir -p /tmp/general-agent-final
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          print('Merge conflicts:', conflicts)
          allowed={'package.json','pnpm-lock.yaml','src/hosted-agent/index.ts'}
          assert all(p in allowed or p.startswith('docs/') for p in conflicts), conflicts
          if 'package.json' in conflicts:
            base=json.loads(git('show',':1:package.json')); ours=json.loads(git('show',':2:package.json')); theirs=json.loads(git('show',':3:package.json'))
            sentinel=object()
            def merge(b,o,t,path=()):
              if path==('version',): return t
              if o==b: return t
              if t==b or o==t: return o
              if all(isinstance(x,dict) for x in (b,o,t)):
                result={}
                for k in b.keys()|o.keys()|t.keys():
                  v=merge(b.get(k,sentinel),o.get(k,sentinel),t.get(k,sentinel),path+(k,))
                  if v is not sentinel: result[k]=v
                return result
              if path and path[0]=='peerDependencies' and isinstance(o,str) and isinstance(t,str):
                return ' || '.join(dict.fromkeys(t.split(' || ')+o.split(' || ')))
              raise RuntimeError(('Unreviewed package conflict',path,b,o,t))
            Path('package.json').write_text(json.dumps(merge(base,ours,theirs),indent=2)+'\n')
            subprocess.run(['git','add','package.json'],check=True)
          if 'src/hosted-agent/index.ts' in conflicts:
            ours=git('show',':2:src/hosted-agent/index.ts'); theirs=git('show',':3:src/hosted-agent/index.ts')
            pattern=r'function conversationProfile\(profile: AgentProfile\): AgentProfile \{[\s\S]*?\n\}\n'
            body=re.search(pattern,ours); assert body
            theirs,n=re.subn(pattern,lambda _:body.group(0),theirs,count=1); assert n==1
            tools=re.search(r'export const CONVERSATION_TOOLS_OFF = .*? as const',ours); assert tools
            theirs,n=re.subn(r'export const CONVERSATION_TOOLS_OFF = .*? as const',lambda _:tools.group(0),theirs,count=1); assert n==1
            if "import { withDefaultAgentHome } from '../profile/home'" not in theirs:
              theirs="import { withDefaultAgentHome } from '../profile/home'\n"+theirs
            tail=ours.split('export type HostedAgent = ReturnType<typeof createHostedAgent>')[1]
            theirs=theirs.rstrip()+'\n'+tail
            Path('src/hosted-agent/index.ts').write_text(theirs)
            subprocess.run(['git','add','src/hosted-agent/index.ts'],check=True)
          for p in conflicts:
            if p=='pnpm-lock.yaml' or p.startswith('docs/'):
              subprocess.run(['git','checkout','--theirs','--',p],check=True)
              subprocess.run(['git','add',p],check=True)
          p=Path('bin/tangle-agent/provision.mjs'); s=p.read_text()
          s=s.replace('profile: agentProfileSchema }).strict()', 'profile: z.record(z.string(), z.unknown()).transform(value => agentProfileSchema.parse(value)) }).strict()')
          s=s.replace('baseProfile: agentProfileSchema.default({}),', 'baseProfile: z.record(z.string(), z.unknown()).default({}).transform(value => agentProfileSchema.parse(value)),')
          p.write_text(s)
          PY
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile 2>&1 | tee /tmp/general-agent-final/resolve.log
          git add package.json pnpm-lock.yaml bin/tangle-agent/provision.mjs
          git rm --ignore-unmatch .github/workflows/tangle-agent-v1-build.yml .github/workflows/tangle-agent-v1-finish.yml .github/workflows/tangle-agent-sync-main.yml
          git diff --check
          git -c user.name=tangletools -c user.email=hello@tangle.tools commit -m 'feat: reconcile general agent with current main and canonical profile validation'
          git push origin HEAD:feat/default-agent-home
          git rev-parse HEAD > /tmp/general-agent-final/REVISION
      - name: Compile and exercise the actual executable
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/general-agent-final/install.log
          pnpm typecheck 2>&1 | tee /tmp/general-agent-final/types.log
          pnpm build 2>&1 | tee /tmp/general-agent-final/build.log
          python3 - <<'PY'
          import yaml,subprocess
          workflow=yaml.safe_load(open('.github/workflows/tangle-agent-runtime-check.yml'))
          step=next(s for s in workflow['jobs']['runtime']['steps'] if s['name'].startswith('Run bootstrap'))
          # Run the same checked-in lifecycle proof, not a second implementation.
          subprocess.run(['mkdir','-p','verification'],check=True)
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          PY
          cp verification/runtime.log /tmp/general-agent-final/
          pnpm docs:gen 2>&1 | tee /tmp/general-agent-final/docs.log
          git add docs
          if ! git diff --cached --quiet; then
            git -c user.name=tangletools -c user.email=hello@tangle.tools commit -m 'docs: regenerate the composed general-agent API'
            git push origin HEAD:feat/default-agent-home
          fi
          pnpm pack --pack-destination /tmp/general-agent-final
          git rev-parse HEAD > /tmp/general-agent-final/REVISION
      - name: Retain exact verification source
        if: always()
        run: |
          mkdir -p /tmp/general-agent-final
          git archive --format=tar HEAD > /tmp/general-agent-final/source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: general-agent-final-${{ github.run_id }}
          path: /tmp/general-agent-final/
          retention-days: 3
