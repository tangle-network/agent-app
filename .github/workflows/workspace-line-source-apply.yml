name: Apply reviewed application line source
on:
  push:
    branches: [ops/workspace-lines-ready-20260929]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const assert = require('node:assert/strict');
            const {owner,repo}=context.repo;
            async function read(path,ref) {
              const {data}=await github.rest.repos.getContent({owner,repo,path,ref});
              assert.ok(!Array.isArray(data)&&data.type==='file'&&data.encoding==='base64');
              return {sha:data.sha,content:Buffer.from(data.content,'base64').toString('utf8')};
            }
            const manifest=JSON.parse((await read('.line-integration/manifest.json',context.sha)).content);
            assert.equal((await github.rest.git.getRef({owner,repo,ref:`heads/${manifest.baseRef}`})).data.object.sha,manifest.base);
            const base=await github.rest.git.getCommit({owner,repo,commit_sha:manifest.base});
            const changes=new Map();
            for(const edit of manifest.edits) {
              assert.ok(!edit.path.startsWith('.github/')&&!edit.path.includes('..'));
              const source=changes.get(edit.path)??(await read(edit.path,manifest.base)).content;
              if(edit.append!==undefined) {
                assert.ok(!source.includes(edit.append.trim()),`Existing export: ${edit.path}`);
                changes.set(edit.path,source.trimEnd()+'\n'+edit.append);
              } else {
                assert.equal(typeof edit.old,'string');assert.ok(edit.old.length);
                assert.equal(source.split(edit.old).length-1,edit.count??1,`Review changed anchor: ${edit.path} ${edit.old.slice(0,80)}`);
                changes.set(edit.path,source.split(edit.old).join(edit.new));
              }
            }
            const tree=[];
            for(const [path,content] of changes) {
              const blob=await github.rest.git.createBlob({owner,repo,content,encoding:'utf-8'});
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            for(const file of manifest.files) {
              assert.ok(!file.path.startsWith('.github/')&&!file.path.includes('..')&&!changes.has(file.path));
              if(file.previousSha) assert.equal((await read(file.path,manifest.base)).sha,file.previousSha);
              else {try {await read(file.path,manifest.base);throw new Error(`File exists: ${file.path}`)}catch(e){if(e.status!==404)throw e}}
              const candidate=await read(file.path,context.sha);
              tree.push({path:file.path,mode:'100644',type:'blob',sha:candidate.sha});
            }
            const created=await github.rest.git.createTree({owner,repo,base_tree:base.data.tree.sha,tree});
            const commit=await github.rest.git.createCommit({owner,repo,message:manifest.message,tree:created.data.sha,parents:[manifest.base]});
            console.log(JSON.stringify({repository:`${owner}/${repo}`,base:manifest.base,commit:commit.data.sha,tree:created.data.sha,paths:tree.map(x=>x.path),verification:'source application only; build remains required'}));
