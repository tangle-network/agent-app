# One-shot branch repair. The merge commit removes this workflow before signoff.
name: Harness merge verification
on:
  push:
    branches: ['refactor/harness-modularity-20261014']
    paths: ['.github/workflows/harness-merge-verify.yml']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: harness-app-merge-repair
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Merge current source while regenerating only conflicted API artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin a82aafc3013ca18d88d726426144631afe53ef2e
          git merge --no-commit --no-ff a82aafc3013ca18d88d726426144631afe53ef2e || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          allowed={'docs/CODEMAP.md','docs/codemap.json','docs/llms.txt','docs/llms-full.txt','docs/api/harness.md'}
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          if set(conflicts)-allowed: raise SystemExit(f'Unexpected source conflicts: {conflicts}')
          if conflicts:
              subprocess.run(['git','checkout','--ours','--',*conflicts],check=True)
              subprocess.run(['git','add','--',*conflicts],check=True)
          PY
          pnpm install --frozen-lockfile
          pnpm docs:gen
          git add -- docs/CODEMAP.md docs/codemap.json docs/llms.txt docs/llms-full.txt docs/api/harness.md
          git rm -- .github/workflows/harness-merge-verify.yml
          git diff --cached --check
          git commit -m 'merge(main): retain current SSO changes and regenerate harness API docs'
          git push origin HEAD:refs/heads/refactor/harness-modularity-20261014
          git rev-parse HEAD > "$RUNNER_TEMP/verified-head.txt"
      - name: Verify the reconciled source with maintained signoff
        env:
          VITEST_MAX_WORKERS: '2'
          TMPDIR: ${{ runner.temp }}
          VERIFICATION_DIR: ${{ runner.temp }}/harness-signoff
        run: pnpm signoff --source head --max-parallel 1 --keep-going --json "$RUNNER_TEMP/signoff.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: harness-merge-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/verified-head.txt
            ${{ runner.temp }}/signoff.json
          if-no-files-found: warn
          retention-days: 7
