name: Tangle agent v1 source handoff

on:
  push:
    branches: [feat/default-agent-home]
    paths: [.github/workflows/tangle-agent-v1-package.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive the exact source revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tangle-agent-v1"
          git archive --format=tar HEAD > "$RUNNER_TEMP/tangle-agent-v1/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/tangle-agent-v1/REVISION"
          cd "$RUNNER_TEMP/tangle-agent-v1"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tangle-agent-v1-source-${{ github.sha }}
          path: ${{ runner.temp }}/tangle-agent-v1/
          if-no-files-found: error
          retention-days: 1
