name: Apply package migration
on:
  push:
    branches: [codex/published-packages-sweep-1-20260926]
    paths: [.github/workflows/apply-package-migration.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.24.0
      - name: Apply source migration and resolve lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('package.json')
          j = json.loads(p.read_text())
          assert j['devDependencies']['@tangle-network/hub-sdk'] == '0.19.0'
          j['devDependencies']['@tangle-network/hub-sdk'] = '0.19.2'
          j['peerDependencies']['@tangle-network/hub-sdk'] = '>=0.19.2 <0.20.0'
          j['devDependencies']['@tangle-network/agent-interface'] = '2.13.0'
          j['devDependencies']['@tangle-network/sandbox'] = '0.54.2'
          j['peerDependencies']['@tangle-network/sandbox'] += ' || ^0.54.0'
          p.write_text(json.dumps(j, indent=2) + '\n')
          p = Path('src/integrations/index.ts')
          s = p.read_text()
          s = s.replace('thin app-side wiring on top: a typed client over the platform hub\'s', 'thin app-side wiring on top: an outcome adapter over hub-sdk\'s')
          s = s.replace("import { parseIntegrationToolName }", "import { HubClient, HubSdkError } from '@tangle-network/hub-sdk'\nimport { parseIntegrationToolName }")
          start = s.index('interface HubEnvelope {')
          end = s.index('/** Define input parameters for invoking a hub tool', start)
          replacement = '''/** Product outcome adapter over the published Hub transport. Never grants approval. */
          export class HubExecClient {
            private readonly hub: HubClient

            constructor(options: HubExecClientOptions) {
              if (!options.baseUrl) throw new Error('HubExecClient: baseUrl is required')
              if (!options.bearer) throw new Error('HubExecClient: bearer is required')
              this.hub = new HubClient({ baseUrl: options.baseUrl, apiKey: options.bearer, fetch: options.fetchImpl })
            }

            async exec(input: { path: string; actionInput?: unknown; connectionId?: string }): Promise<HubExecResult> {
              try {
                // No approve flag. Hub still decides whether this exact action is permitted.
                const result = await this.hub.tools.invoke(input.path, input.actionInput, { connectionId: input.connectionId })
                return { succeeded: true, result: result.result }
              } catch (error) {
                if (!(error instanceof HubSdkError)) throw error
                const details = error.details
                const approval = details && typeof details === 'object' && 'approval' in details ? details.approval : undefined
                return { succeeded: false, code: error.code, message: error.message, ...(approval !== undefined ? { approval } : {}) }
              }
            }
          }

          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          rm .github/workflows/apply-package-migration.yml
          pnpm install --lockfile-only --ignore-scripts
          git diff --check
          git config user.name 'Drew Stone'
          git config user.email '13153687+drewstone@users.noreply.github.com'
          git add -u
          git commit -m 'refactor: use published Hub SDK for app integration execution'
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
      - name: Push migration branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:refs/heads/codex/published-packages-sweep-1-20260926
      - name: Install locked published dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Build real package
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: migration-proof
          path: evidence/
          retention-days: 7
