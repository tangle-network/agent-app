name: Apply package migration
on:
  push:
    branches: [codex/published-packages-sweep-1-20260926]
    paths: [.github/workflows/apply-package-migration.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.24.0
      - name: Apply exact source change
        env:
          PATCH: 
        run: |
          python - <<'PY'
          import base64, hashlib, os, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(patch).hexdigest() == '892ef5486d14fe3f36ca94c8e0f5714b9658ab2af3e734ab1589724ec8430627'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          rm .github/workflows/apply-package-migration.yml
          pnpm install --lockfile-only --ignore-scripts
          git diff --check
          git config user.name 'Drew Stone'
          git config user.email '13153687+drewstone@users.noreply.github.com'
          git add -u
          git commit -m 'refactor: use published Hub SDK for app integration execution'
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
      - name: Push migration branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin HEAD:refs/heads/codex/published-packages-sweep-1-20260926
      - name: Install locked published dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee evidence/install.log
      - name: Build real package
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: migration-proof
          path: evidence/
          retention-days: 7
