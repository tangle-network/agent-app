packages:
  - '.'

autoInstallPeers: false
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    '@ph0ny/sdk@0.1.2>typescript': '7.0.2'

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@tangle-network/*'
  - '@ph0ny/sdk@0.1.2'

overrides:
  zod: 4.4.3

allowBuilds:
  '@ax-llm/ax': false
  cpu-features: false
  esbuild: true
  ssh2: false
  workerd: true
